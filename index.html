<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AARYAV PANNEL SPAM IG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0a0a] text-white font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [authView, setAuthView] = React.useState('signin');
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [loginUsername, setLoginUsername] = React.useState('');
            const [loginPassword, setLoginPassword] = React.useState('');
            const [regUsername, setRegUsername] = React.useState('');
            const [regPassword, setRegPassword] = React.useState('');

            const [activeTab, setActiveTab] = React.useState('control');
            const [nodes, setNodes] = React.useState([]);
            const [selectedNodeId, setSelectedNodeId] = React.useState('');

            const [targetThread, setTargetThread] = React.useState('');
            const [jitterDelay, setJitterDelay] = React.useState('3.5');
            const [payloadLines, setPayloadLines] = React.useState('');
            const [isSpamming, setIsSpamming] = React.useState(false);

            const [ncText, setNcText] = React.useState('');
            const [ncActive, setNcActive] = React.useState(false);

            const [logs, setLogs] = React.useState([]);

            // Sync telemetry logs from backend continuously
            React.useEffect(() => {
                if(!isLoggedIn) return;
                const interval = setInterval(() => {
                    fetch('/api/logs')
                        .then(res => res.json())
                        .then(data => {
                            if(data.logs) setLogs(data.logs);
                            if(data.active_tasks) {
                                if(data.active_tasks['spam_task'] !== undefined) setIsSpamming(data.active_tasks['spam_task']);
                                if(data.active_tasks['nc_task'] !== undefined) setNcActive(data.active_tasks['nc_task']);
                            }
                        })
                        .catch(() => {});
                }, 2000);
                return () => clearInterval(interval);
            }, [isLoggedIn]);

            const handleSignIn = (e) => {
                e.preventDefault();
                const savedUser = localStorage.getItem('panel_user');
                const savedPass = localStorage.getItem('panel_pass');
                if (savedUser && loginUsername === savedUser && loginPassword === savedPass) {
                    setIsLoggedIn(true);
                } else if (!savedUser) {
                    alert('No user found! Please Sign Up first.');
                } else {
                    alert('Invalid credentials!');
                }
            };

            const handleSignUp = (e) => {
                e.preventDefault();
                if(!regUsername || !regPassword) return alert('Fill all fields');
                localStorage.setItem('panel_user', regUsername);
                localStorage.setItem('panel_pass', regPassword);
                alert('Account registered! Now Sign In.');
                setAuthView('signin');
            };

            const handleAddSessionId = () => {
                const sessionCookie = prompt("Enter Instagram Account Session ID (Cookie):");
                if (sessionCookie && sessionCookie.trim()) {
                    const accountName = prompt("Enter Instagram Username for this session:", `ig_user_${Math.floor(Math.random()*1000)}`);
                    const newNode = {
                        id: Date.now().toString(),
                        username: accountName || 'ig_account',
                        sessionid: sessionCookie.trim(),
                        status: 'ONLINE'
                    };
                    setNodes(prev => [...prev, newNode]);
                    if(!selectedNodeId) setSelectedNodeId(newNode.id);
                }
            };

            const toggleSpam = () => {
                if(nodes.length === 0) return alert('Add IG Session ID first!');
                if(!targetThread || !payloadLines) return alert('Fill thread ID and payload lines!');

                const endpoint = isSpamming ? '/api/task/stop' : '/api/task/start';
                const payload = {
                    task_id: 'spam_task',
                    type: 'spam',
                    sessions: nodes,
                    thread_id: targetThread,
                    jitter: jitterDelay,
                    payload: payloadLines.split('\n').filter(x => x.trim())
                };

                fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                }).then(res => res.json()).then(data => {
                    setIsSpamming(!isSpamming);
                });
            };

            const toggleNcLock = () => {
                if(nodes.length === 0) return alert('Add IG Session ID first!');
                if(!ncText) return alert('Fill group title base!');

                const endpoint = ncActive ? '/api/task/stop' : '/api/task/start';
                const payload = {
                    task_id: 'nc_task',
                    type: 'nclock',
                    sessions: nodes,
                    jitter: jitterDelay,
                    nc_text: ncText
                };

                fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                }).then(res => res.json()).then(data => {
                    setNcActive(!ncActive);
                });
            };

            return (
                <div className="min-h-screen bg-[#0a0a0a] text-white p-4 flex flex-col">
                    {!isLoggedIn ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="bg-[#141414] border border-red-900/60 p-6 rounded-2xl w-full max-w-md shadow-[0_0_30px_rgba(255,0,60,0.2)]">
                                <div className="text-center mb-6">
                                    <h1 className="text-xl font-black text-red-600 uppercase">AARYAV PANNEL SPAM IG</h1>
                                    <p className="text-xs text-neutral-400">Owner: @Abusivegang</p>
                                </div>
                                {authView === 'signin' ? (
                                    <form onSubmit={handleSignIn} className="flex flex-col gap-4">
                                        <input type="text" placeholder="Username" value={loginUsername} onChange={e=>setLoginUsername(e.target.value)} className="bg-black border border-neutral-800 rounded p-2.5 text-xs text-white outline-none"/>
                                        <input type="password" placeholder="Password" value={loginPassword} onChange={e=>setLoginPassword(e.target.value)} className="bg-black border border-neutral-800 rounded p-2.5 text-xs text-white outline-none"/>
                                        <button type="submit" className="py-3 bg-red-600 font-bold text-xs uppercase rounded">Sign In</button>
                                        <div className="text-center text-xs"><button type="button" onClick={()=>setAuthView('signup')} className="text-red-500 font-bold">Sign Up for Lifetime Access</button></div>
                                    </form>
                                ) : (
                                    <form onSubmit={handleSignUp} className="flex flex-col gap-4">
                                        <input type="text" placeholder="Choose Username" value={regUsername} onChange={e=>setRegUsername(e.target.value)} className="bg-black border border-neutral-800 rounded p-2.5 text-xs text-white outline-none"/>
                                        <input type="password" placeholder="Choose Password" value={regPassword} onChange={e=>setRegPassword(e.target.value)} className="bg-black border border-neutral-800 rounded p-2.5 text-xs text-white outline-none"/>
                                        <button type="submit" className="py-3 bg-red-600 font-bold text-xs uppercase rounded">Register Account</button>
                                        <div className="text-center text-xs"><button type="button" onClick={()=>setAuthView('signin')} className="text-red-500 font-bold">Back to Sign In</button></div>
                                    </form>
                                )}
                            </div>
                        </div>
                    ) : (
                        <div className="flex flex-col flex-1 gap-4">
                            <header className="border-b border-red-900/60 pb-4 flex justify-between items-center bg-[#141414] p-4 rounded-xl">
                                <div>
                                    <h1 className="text-2xl font-black text-red-600 uppercase">AARYAV PANNEL SPAM IG</h1>
                                    <p className="text-xs text-neutral-400">Status: <span className="text-emerald-500 font-bold">SERVER BACKGROUND WORKER ACTIVE</span></p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={handleAddSessionId} className="bg-red-600 text-white px-3 py-2 rounded text-xs font-bold">+ Add ID</button>
                                    <button onClick={()=>setIsLoggedIn(false)} className="bg-neutral-900 text-neutral-400 px-3 py-2 rounded text-xs">Logout</button>
                                </div>
                            </header>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 flex-1">
                                <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-red-500 uppercase">Spam Campaign Config</h2>
                                    <input type="text" placeholder="Target GC Thread ID" value={targetThread} onChange={e=>setTargetThread(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <input type="text" placeholder="Jitter Delay (Sec)" value={jitterDelay} onChange={e=>setJitterDelay(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <textarea rows="4" placeholder="Payload lines..." value={payloadLines} onChange={e=>setPayloadLines(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none resize-none"></textarea>
                                    <button onClick={toggleSpam} className={`py-3 rounded font-bold text-xs uppercase ${isSpamming ? 'bg-red-950 text-red-500 border border-red-600 animate-pulse' : 'bg-red-600 text-white'}`}>
                                        {isSpamming ? 'HALT BACKGROUND SPAM' : 'LAUNCH BACKGROUND SPAM'}
                                    </button>
                                </div>

                                <div className="lg:col-span-2 flex flex-col gap-4">
                                    <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex flex-col gap-3">
                                        <h2 className="text-sm font-bold text-red-500 uppercase">Group Name Protection (NC Lock)</h2>
                                        <input type="text" placeholder="Protected Title Base" value={ncText} onChange={e=>setNcText(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                        <button onClick={toggleNcLock} className={`py-2.5 rounded font-bold text-xs uppercase ${ncActive ? 'bg-red-900 text-white' : 'bg-neutral-800 text-red-400'}`}>
                                            {ncActive ? 'DISABLE BACKGROUND NC LOCK' : 'ENABLE BACKGROUND NC LOCK'}
                                        </button>
                                    </div>

                                    <div className="bg-black border border-red-950 p-3 rounded-xl flex-1 font-mono text-[11px] h-52 overflow-y-auto text-red-500 shadow-inner flex flex-col">
                                        <div className="text-neutral-600 border-b border-neutral-900 pb-1 mb-1">[LIVE SERVER LOGS - PERSISTENT BACKGROUND TASK]</div>
                                        {logs.map((lg, i) => <div key={i}>{lg}</div>)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
