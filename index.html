<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AARYAV PANNEL SPAM IG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0a0a] text-white font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [authView, setAuthView] = React.useState('signin');
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [loginUsername, setLoginUsername] = React.useState('');
            const [loginPassword, setLoginPassword] = React.useState('');

            const [nodes, setNodes] = React.useState([]);
            const [selectedNodeId, setSelectedNodeId] = React.useState('');
            const [inputSessionId, setInputSessionId] = React.useState('');
            const [isVerifying, setIsVerifying] = React.useState(false);

            // Controls
            const [spamThread, setSpamThread] = React.useState('');
            const [spamJitter, setSpamJitter] = React.useState('3.5');
            const [spamPayload, setSpamPayload] = React.useState('');

            const [ncThread, setNcThread] = React.useState('');
            const [ncText, setNcText] = React.useState('');
            const [ncJitter, setNcJitter] = React.useState('4.0');

            const [activeTasks, setActiveTasks] = React.useState([]);
            const [logs, setLogs] = React.useState([]);

            React.useEffect(() => {
                if (localStorage.getItem('panel_logged_in') === 'true') setIsLoggedIn(true);
                const savedNodes = localStorage.getItem('panel_nodes');
                if (savedNodes) {
                    try {
                        const parsed = JSON.parse(savedNodes);
                        setNodes(parsed);
                        if(parsed.length > 0) setSelectedNodeId(parsed[0].id);
                    } catch(e) {}
                }
            }, []);

            React.useEffect(() => {
                if(nodes.length > 0) localStorage.setItem('panel_nodes', JSON.stringify(nodes));
            }, [nodes]);

            // Sync Tasks and Logs
            React.useEffect(() => {
                if(!isLoggedIn) return;
                const interval = setInterval(() => {
                    fetch('/api/tasks/active')
                        .then(res => res.json())
                        .then(data => {
                            if(data.tasks) setActiveTasks(data.tasks);
                            if(data.logs) setLogs(data.logs);
                        })
                        .catch(() => {});
                }, 2000);
                return () => clearInterval(interval);
            }, [isLoggedIn]);

            const handleSignIn = (e) => {
                e.preventDefault();
                setIsLoggedIn(true);
                localStorage.setItem('panel_logged_in', 'true');
            };

            const handleAddAccount = (e) => {
                e.preventDefault();
                if (!inputSessionId.trim()) return alert('Enter Session ID');

                setIsVerifying(true);
                fetch('/api/account/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sessionid: inputSessionId.trim() })
                })
                .then(res => res.json())
                .then(data => {
                    setIsVerifying(false);
                    if(data.status === 'success') {
                        const newNode = { id: Date.now().toString(), username: data.username, sessionid: data.sessionid };
                        setNodes(prev => [...prev, newNode]);
                        setSelectedNodeId(newNode.id);
                        setInputSessionId('');
                        alert(`Connected @${data.username}`);
                    } else alert(data.message);
                })
                .catch(() => { setIsVerifying(false); alert('Verification Error'); });
            };

            const startSpam = () => {
                const activeNode = nodes.find(n => n.id === selectedNodeId);
                if(!activeNode) return alert('Select Instagram ID');
                if(!spamThread || !spamPayload) return alert('Fill Thread ID & Payload');

                // Split multiline string while keeping empty line patterns intact
                const formattedPayload = spamPayload.split('\n');

                fetch('/api/task/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        type: 'spam',
                        session_id: activeNode.sessionid,
                        username: activeNode.username,
                        thread_id: spamThread,
                        jitter: spamJitter,
                        payload: formattedPayload
                    })
                });
            };

            const startNcLock = () => {
                const activeNode = nodes.find(n => n.id === selectedNodeId);
                if(!activeNode) return alert('Select Instagram ID');
                if(!ncThread || !ncText) return alert('Fill Thread ID & Title Base');

                fetch('/api/task/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        type: 'nclock',
                        session_id: activeNode.sessionid,
                        username: activeNode.username,
                        thread_id: ncThread,
                        jitter: ncJitter,
                        nc_text: ncText
                    })
                });
            };

            const stopTask = (taskId) => {
                fetch('/api/task/stop', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ task_id: taskId })
                });
            };

            return (
                <div className="min-h-screen bg-[#0a0a0a] text-white p-4 flex flex-col">
                    {!isLoggedIn ? (
                        <div className="flex-1 flex items-center justify-center">
                            <form onSubmit={handleSignIn} className="bg-[#141414] border border-red-900/60 p-6 rounded-2xl w-full max-w-md flex flex-col gap-4">
                                <h1 className="text-xl font-black text-red-600 uppercase text-center">AARYAV PANNEL SPAM IG</h1>
                                <input type="text" placeholder="Username" value={loginUsername} onChange={e=>setLoginUsername(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                <input type="password" placeholder="Password" value={loginPassword} onChange={e=>setLoginPassword(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                <button type="submit" className="py-2.5 bg-red-600 font-bold text-xs uppercase rounded">Sign In</button>
                            </form>
                        </div>
                    ) : (
                        <div className="flex flex-col flex-1 gap-4 max-w-6xl mx-auto w-full">
                            <header className="border-b border-red-900/60 pb-3 flex justify-between items-center bg-[#141414] p-4 rounded-xl">
                                <h1 className="text-xl font-black text-red-600 uppercase">AARYAV PANNEL SPAM IG</h1>
                                <button onClick={()=>{setIsLoggedIn(false); localStorage.removeItem('panel_logged_in');}} className="bg-neutral-900 text-neutral-400 px-3 py-1.5 rounded text-xs">Logout</button>
                            </header>

                            {/* Account Manager */}
                            <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex flex-col gap-3">
                                <span className="text-xs font-bold text-red-500 uppercase">1. Add & Select Account</span>
                                <form onSubmit={handleAddAccount} className="flex gap-2">
                                    <input type="text" placeholder="Paste sessionid cookie..." value={inputSessionId} onChange={e=>setInputSessionId(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs flex-1 outline-none text-white"/>
                                    <button type="submit" disabled={isVerifying} className="bg-red-600 text-white px-4 py-2 rounded text-xs font-bold">{isVerifying ? 'Verifying...' : '+ Add ID'}</button>
                                </form>
                                <select value={selectedNodeId} onChange={e=>setSelectedNodeId(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs text-red-400 font-bold outline-none">
                                    {nodes.length === 0 ? <option>No Accounts Saved</option> : nodes.map(n => <option key={n.id} value={n.id}>@{n.username}</option>)}
                                </select>
                            </div>

                            {/* Main Controls */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-red-500 uppercase">Spam DM Campaign</h2>
                                    <input type="text" placeholder="Target Thread ID" value={spamThread} onChange={e=>setSpamThread(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <input type="text" placeholder="Delay Sec (e.g. 3.5)" value={spamJitter} onChange={e=>setSpamJitter(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <textarea rows="4" placeholder="Messages (Supports blank newlines)..." value={spamPayload} onChange={e=>setSpamPayload(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none resize-none"></textarea>
                                    <button onClick={startSpam} className="py-2.5 bg-red-600 font-bold text-xs uppercase rounded">Launch Task</button>
                                </div>

                                <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-red-500 uppercase">NC Lock (Title Protection)</h2>
                                    <input type="text" placeholder="Target Thread ID" value={ncThread} onChange={e=>setNcThread(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <input type="text" placeholder="Protected Base Title" value={ncText} onChange={e=>setNcText(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <input type="text" placeholder="Rotation Delay Sec (e.g. 4.0)" value={ncJitter} onChange={e=>setNcJitter(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <button onClick={startNcLock} className="py-2.5 bg-neutral-800 text-red-400 font-bold text-xs uppercase rounded hover:bg-neutral-700">Enable NC Lock</button>
                                </div>
                            </div>

                            {/* Active Processes Monitor */}
                            <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex flex-col gap-3">
                                <h2 className="text-sm font-bold text-red-500 uppercase">Active Running Processes</h2>
                                {activeTasks.length === 0 ? (
                                    <p className="text-xs text-neutral-500 italic">No tasks currently running.</p>
                                ) : (
                                    <div className="flex flex-col gap-2">
                                        {activeTasks.map(t => (
                                            <div key={t.task_id} className="flex justify-between items-center bg-black p-2.5 border border-neutral-900 rounded">
                                                <div className="text-xs">
                                                    <span className="text-red-500 font-bold">[{t.type.toUpperCase()}]</span>
                                                    <span className="ml-2 text-neutral-300">@{t.username}</span>
                                                    <span className="ml-2 text-neutral-500">Thread: {t.thread_id}</span>
                                                    <span className="ml-2 text-neutral-600">({t.started_at})</span>
                                                </div>
                                                <button onClick={() => stopTask(t.task_id)} className="bg-red-900 hover:bg-red-700 text-white text-[10px] font-bold px-3 py-1 rounded uppercase">
                                                    Terminate
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Logs */}
                            <div className="bg-black border border-red-950 p-3 rounded-xl font-mono text-[11px] h-40 overflow-y-auto text-red-500">
                                {logs.map((lg, i) => <div key={i}>{lg}</div>)}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
