<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AARYAV PANNEL - Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#050505',
                        panelbg: '#0a0a0a',
                        cardbg: '#121212',
                        bordercol: '#1f1f1f',
                        accentred: '#dc2626'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#050505] text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [loginUser, setLoginUser] = React.useState('');
            const [loginPass, setLoginPass] = React.useState('');
            
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [nodes, setNodes] = React.useState([]);
            const [selectedNodeId, setSelectedNodeId] = React.useState('');
            const [inputSessionId, setInputSessionId] = React.useState('');
            const [isVerifying, setIsVerifying] = React.useState(false);

            const [selectedAccountIds, setSelectedAccountIds] = React.useState({});
            const [statusMsg, setStatusMsg] = React.useState(null);

            const [uptimeSeconds, setUptimeSeconds] = React.useState(0);

            const showNotify = (text, type = 'info') => {
                setStatusMsg({ text, type });
                setTimeout(() => setStatusMsg(null), 4000);
            };

            const [spamThread, setSpamThread] = React.useState('');
            const [spamTargetName, setSpamTargetName] = React.useState('');
            const [spamJitter, setSpamJitter] = React.useState('3.5');
            const [spamPayload, setSpamPayload] = React.useState('');
            const [payloadProfile, setPayloadProfile] = React.useState('Aws users');

            const [swarmThread, setSwarmThread] = React.useState('');
            const [swarmJitter, setSwarmJitter] = React.useState('3.5');

            const [ncThread, setNcThread] = React.useState('');
            const [ncText, setNcText] = React.useState('');
            const [ncJitter, setNcJitter] = React.useState('4.0');

            // Mass GC Creator State
            const [massPrefix, setMassPrefix] = React.useState('MONARCH');
            const [massAmount, setMassAmount] = React.useState('20');
            const [massUsernames, setMassUsernames] = React.useState('harmonyistt\naaryavbaap12');
            
            // Custom Multi-GC Fight Templates State
            const [globalTargetName, setGlobalTargetName] = React.useState('MONARCH');
            const [ncBoxText, setNcBoxText] = React.useState('{target} GC LEFT LE RANDIKE {emoji}');
            const [spamBoxText, setSpamBoxText] = React.useState('{target} GC LEFT LE RANDIBALA {emoji}');
            const [fightInterval, setFightInterval] = React.useState('300');

            const [groupTitle, setGroupTitle] = React.useState('');
            const [groupMembers, setGroupMembers] = React.useState('');
            const [isCreatingGroup, setIsCreatingGroup] = React.useState(false);

            const [activeTasks, setActiveTasks] = React.useState([]);
            const [logs, setLogs] = React.useState([]);

            const chartInstance = React.useRef(null);

            const formatUptime = (totalSec) => {
                const days = Math.floor(totalSec / (3600 * 24));
                const hours = Math.floor((totalSec % (3600 * 24)) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;
                
                const pad = (n) => String(n).padStart(2, '0');
                if (days > 0) {
                    return `${days}d ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
                }
                return `${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
            };

            React.useEffect(() => {
                if(localStorage.getItem('panel_logged') === 'true') setIsLoggedIn(true);
                const saved = localStorage.getItem('panel_nodes');
                if(saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        setNodes(parsed);
                        if(parsed.length > 0) {
                            setSelectedNodeId(parsed[0].id);
                            const initialSelected = {};
                            parsed.forEach(n => initialSelected[n.id] = true);
                            setSelectedAccountIds(initialSelected);
                        }
                    } catch(e){}
                }
            }, []);

            React.useEffect(() => {
                if(nodes.length > 0) localStorage.setItem('panel_nodes', JSON.stringify(nodes));
            }, [nodes]);

            React.useEffect(() => {
                if(!isLoggedIn) return;
                const interval = setInterval(() => {
                    fetch('/api/tasks/active')
                    .then(res => res.json())
                    .then(data => {
                        if(data.tasks) setActiveTasks(data.tasks);
                        if(data.logs) setLogs(data.logs);
                        if(data.uptime_seconds !== undefined) setUptimeSeconds(data.uptime_seconds);
                    }).catch(()=>{});
                }, 2000);

                const tick = setInterval(() => {
                    setUptimeSeconds(prev => prev + 1);
                }, 1000);

                return () => {
                    clearInterval(interval);
                    clearInterval(tick);
                };
            }, [isLoggedIn]);

            const handleLogin = (e) => {
                e.preventDefault();
                setIsLoggedIn(true);
                localStorage.setItem('panel_logged', 'true');
            };

            const handleAddAccount = (e) => {
                e.preventDefault();
                if(!inputSessionId.trim()) return showNotify('Enter Session ID', 'error');
                setIsVerifying(true);
                fetch('/api/account/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sessionid: inputSessionId.trim() })
                })
                .then(res => res.json())
                .then(data => {
                    setIsVerifying(false);
                    if(data.status === 'success') {
                        const newItem = { id: Date.now().toString(), username: data.username, sessionid: data.sessionid };
                        setNodes(prev => [...prev, newItem]);
                        setSelectedAccountIds(prev => ({ ...prev, [newItem.id]: true }));
                        setSelectedNodeId(newItem.id);
                        setInputSessionId('');
                        showNotify(`Connected @${data.username}`, 'success');
                    } else showNotify(data.message, 'error');
                }).catch(()=>{ setIsVerifying(false); showNotify('Network Error', 'error'); });
            };

            const removeAccount = (id) => {
                setNodes(prev => prev.filter(n => n.id !== id));
                showNotify('Account removed', 'info');
            };

            const toggleAccountSelection = (id) => {
                setSelectedAccountIds(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const toggleSelectAllAccounts = () => {
                const allSelected = nodes.every(n => selectedAccountIds[n.id]);
                const newObj = {};
                nodes.forEach(n => newObj[n.id] = !allSelected);
                setSelectedAccountIds(newObj);
            };

            const startMassGCCreator = () => {
                const accountsToUse = nodes.filter(n => selectedAccountIds[n.id]).map(n => n.sessionid);
                if(accountsToUse.length === 0) return showNotify('Select at least one account via checkboxes!', 'error');
                const usernamesList = massUsernames.split('\n').map(u => u.trim()).filter(u => u);

                fetch('/api/gcs/create_mass', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        accounts: accountsToUse,
                        usernames: usernamesList,
                        target_prefix: massPrefix,
                        amount: parseInt(massAmount) || 20
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') showNotify(data.message, 'success');
                    else showNotify(data.message, 'error');
                });
            };

            const saveNCText = () => {
                fetch('/api/templates/save_nc', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ nc_text: ncBoxText })
                })
                .then(res => res.json())
                .then(data => showNotify(data.message, 'success'));
            };

            const saveSpamText = () => {
                fetch('/api/templates/save_spam', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ spam_text: spamBoxText })
                })
                .then(res => res.json())
                .then(data => showNotify(data.message, 'success'));
            };

            const startMultiFight = () => {
                const accountsToUse = nodes.filter(n => selectedAccountIds[n.id]).map(n => ({ username: n.username, sessionid: n.sessionid }));
                if(accountsToUse.length === 0) return showNotify('Select at least one connected session!', 'error');

                saveNCText();
                saveSpamText();

                fetch('/api/task/start_multi_fight', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        accounts: accountsToUse,
                        target_name: globalTargetName,
                        interval: parseInt(fightInterval) || 300
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') showNotify(data.message, 'success');
                    else showNotify(data.message, 'error');
                });
            };

            const startSpam = () => {
                const node = nodes.find(n => n.id === selectedNodeId);
                if(!node) return showNotify('Select an Account first', 'error');
                if(!spamThread || !spamPayload) return showNotify('Fill Thread ID & Payload', 'error');
                
                fetch('/api/task/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        type: 'spam', 
                        session_id: node.sessionid, 
                        username: node.username,
                        thread_id: spamThread, 
                        target: spamTargetName, 
                        jitter: spamJitter, 
                        payload: [spamPayload] 
                    })
                }).then(()=>showNotify('Campaign Launched! 🔥', 'success'));
            };

            const startSwarmAttack = () => {
                const accountsToUse = nodes.filter(n => selectedAccountIds[n.id]);
                if(accountsToUse.length === 0) return showNotify('Select at least one account for Swarm Attack', 'error');
                if(!swarmThread || !spamPayload) return showNotify('Fill Thread ID & Payload', 'error');

                fetch('/api/task/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        type: 'swarm_spam',
                        accounts: accountsToUse,
                        thread_id: swarmThread,
                        target: spamTargetName,
                        jitter: swarmJitter,
                        payload: [spamPayload]
                    })
                }).then(() => showNotify(`🐝 Swarm Attack Deployed across ${accountsToUse.length} accounts!`, 'success'));
            };

            const startNcLock = () => {
                const node = nodes.find(n => n.id === selectedNodeId);
                if(!node) return showNotify('Select an Account first', 'error');
                if(!ncThread || !ncText) return showNotify('Fill Thread ID & Title Base', 'error');
                fetch('/api/task/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        type: 'nclock', session_id: node.sessionid, username: node.username,
                        thread_id: ncThread, jitter: ncJitter, nc_text: ncText
                    })
                }).then(()=>showNotify('NC Lock Worker Enabled!', 'success'));
            };

            const handleCreateGroup = (e) => {
                e.preventDefault();
                const node = nodes.find(n => n.id === selectedNodeId);
                if(!node) return showNotify('Select an Account first', 'error');
                if(!groupTitle || !groupMembers) return showNotify('Enter Title and Usernames', 'error');

                setIsCreatingGroup(true);
                fetch('/api/group/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        session_id: node.sessionid,
                        title: groupTitle,
                        usernames: groupMembers.split('\n')
                    })
                })
                .then(res => res.json())
                .then(data => {
                    setIsCreatingGroup(false);
                    if(data.status === 'success') {
                        showNotify(`Group Created! Thread ID: ${data.thread_id}`, 'success');
                        setGroupTitle('');
                        setGroupMembers('');
                    } else showNotify(data.message, 'error');
                }).catch(()=>{ setIsCreatingGroup(false); showNotify('Error creating group', 'error'); });
            };

            const stopTask = (tid) => {
                fetch('/api/task/stop', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ task_id: tid })
                }).then(() => showNotify('Task Terminated', 'info'));
            };

            if(!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#050505] p-4">
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(220,38,38,0.08)_0,transparent_70%)] pointer-events-none"></div>
                        <form onSubmit={handleLogin} className="relative bg-[#0d0d0d] border border-neutral-800/80 p-8 rounded-3xl w-full max-w-md flex flex-col gap-5 shadow-2xl backdrop-blur-xl">
                            <div className="text-center">
                                <span className="inline-block px-3 py-1 bg-red-600/10 text-red-500 rounded-full text-[10px] font-bold tracking-widest uppercase mb-2 border border-red-500/20">SECURE GATEWAY</span>
                                <h1 className="text-2xl font-black text-white tracking-wider">AARYAV PANNEL</h1>
                                <p className="text-xs text-neutral-500 mt-1">Advanced Automation Command Center</p>
                            </div>
                            <div className="flex flex-col gap-3">
                                <div>
                                    <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Username</label>
                                    <input type="text" placeholder="Enter operator handle..." value={loginUser} onChange={e=>setLoginUser(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3.5 text-xs outline-none text-white focus:border-red-600 transition shadow-inner"/>
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Password</label>
                                    <input type="password" placeholder="••••••••••••" value={loginPass} onChange={e=>setLoginPass(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3.5 text-xs outline-none text-white focus:border-red-600 transition shadow-inner"/>
                                </div>
                            </div>
                            <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 font-black text-xs uppercase tracking-widest rounded-xl transition shadow-lg shadow-red-600/20 active:scale-[0.98]">Initialize Session</button>
                        </form>
                    </div>
                );
            }

            const activeNode = nodes.find(n => n.id === selectedNodeId);

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-[#050505]">
                    {/* Modern Glass Sidebar */}
                    <aside className="w-full md:w-72 bg-[#0a0a0a] border-r border-neutral-900 flex flex-col justify-between p-5 select-none z-20">
                        <div>
                            <div className="py-4 px-3 mb-6 bg-black/60 border border-neutral-900 rounded-2xl">
                                <h1 className="text-base font-black text-red-600 tracking-wider flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
                                    AARYAV PANNEL
                                </h1>
                                <div className="flex items-center gap-1.5 mt-2">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                    <span className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">SYSTEM ONLINE</span>
                                </div>
                            </div>

                            <nav className="flex flex-col gap-1.5">
                                {[
                                    { id: 'dashboard', label: '📊 Dashboard', icon: '' },
                                    { id: 'accounts', label: '👤 Accounts Manager', icon: '' },
                                    { id: 'multigc', label: '🔥 Multi-GC Mega Fight', icon: '' },
                                    { id: 'spam', label: '⚡ DM Spam Tool', icon: '' },
                                    { id: 'swarm', label: '🐝 Swarm Attack', icon: '' },
                                    { id: 'nclock', label: '🛡️ NC Lock (Title)', icon: '' },
                                    { id: 'groups', label: '👥 Group Creator', icon: '' },
                                    { id: 'analytics', label: '📈 Analytics & Charts', icon: '' },
                                ].map(tab => (
                                    <button 
                                        key={tab.id}
                                        onClick={()=>setActiveTab(tab.id)} 
                                        className={`text-left px-4 py-3 rounded-xl text-xs font-bold uppercase transition flex items-center justify-between group ${activeTab===tab.id ? 'bg-red-600/10 text-red-500 border border-red-600/30 shadow-lg shadow-red-950/20' : 'text-neutral-400 hover:bg-neutral-900/60 hover:text-white'}`}
                                    >
                                        <span>{tab.label}</span>
                                        <span className={`w-1.5 h-1.5 rounded-full transition ${activeTab===tab.id ? 'bg-red-500' : 'bg-transparent group-hover:bg-neutral-700'}`}></span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        <div className="pt-4 border-t border-neutral-900 flex flex-col gap-3">
                            <div className="bg-black/80 p-3.5 rounded-2xl border border-neutral-900 text-[11px]">
                                <span className="text-neutral-500 block uppercase tracking-wider text-[9px] font-bold">Active Binding</span>
                                <span className="text-red-500 font-black tracking-wide truncate block mt-0.5">{activeNode ? '@'+activeNode.username : 'None Selected'}</span>
                            </div>
                            <button onClick={()=>{setIsLoggedIn(false); localStorage.removeItem('panel_logged');}} className="w-full bg-neutral-900 hover:bg-red-950/40 hover:border-red-900/50 border border-neutral-800 text-neutral-400 hover:text-red-400 py-2.5 rounded-xl text-xs font-bold uppercase transition">Terminate Session</button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 md:p-8 flex flex-col gap-6 max-w-6xl mx-auto w-full">
                        {statusMsg && (
                            <div className={`p-4 rounded-2xl text-xs font-bold flex items-center justify-between transition backdrop-blur-md shadow-lg ${statusMsg.type === 'error' ? 'bg-red-950/80 border border-red-800/80 text-red-200' : statusMsg.type === 'success' ? 'bg-emerald-950/80 border border-emerald-800/80 text-emerald-200' : 'bg-neutral-900/90 border border-neutral-700 text-neutral-200'}`}>
                                <span>{statusMsg.text}</span>
                                <button onClick={()=>setStatusMsg(null)} className="text-xs opacity-60 hover:opacity-100 p-1">✕</button>
                            </div>
                        )}

                        <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-[#0a0a0a] border border-neutral-900 p-5 rounded-2xl gap-4 shadow-xl">
                            <div>
                                <span className="text-[10px] font-bold text-red-500 tracking-widest uppercase bg-red-950/30 px-2.5 py-1 rounded-md border border-red-900/30">CONTROL DECK</span>
                                <h2 className="text-lg font-black uppercase tracking-wider text-white mt-1.5">{activeTab.toUpperCase()} MODULE</h2>
                            </div>

                            <div className="flex flex-wrap items-center gap-4">
                                {/* Live Uptime Badge */}
                                <div className="bg-black/90 border border-emerald-900/50 px-4 py-2.5 rounded-xl flex items-center gap-3 shadow-inner">
                                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <div className="flex flex-col">
                                        <span className="text-[9px] font-bold text-neutral-400 uppercase tracking-widest">UPTIME</span>
                                        <span className="text-sm font-black font-mono text-emerald-400 tracking-wider">
                                            {formatUptime(uptimeSeconds)}
                                        </span>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2 bg-black/60 border border-neutral-900 px-3 py-2 rounded-xl">
                                    <span className="text-xs text-neutral-400">Node:</span>
                                    <select value={selectedNodeId} onChange={e=>setSelectedNodeId(e.target.value)} className="bg-black border border-neutral-800 rounded-lg px-2.5 py-1 text-xs text-red-400 font-bold outline-none cursor-pointer">
                                        {nodes.length === 0 ? <option>No Accounts Added</option> : nodes.map(n => <option key={n.id} value={n.id}>@{n.username}</option>)}
                                    </select>
                                </div>
                            </div>
                        </header>

                        {/* DASHBOARD TAB */}
                        {activeTab === 'dashboard' && (
                            <div className="flex flex-col gap-6">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="bg-[#0a0a0a] border border-neutral-900 p-5 rounded-2xl relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 w-24 h-24 bg-red-600/5 rounded-full blur-2xl group-hover:bg-red-600/10 transition"></div>
                                        <span className="text-neutral-500 text-xs uppercase font-bold tracking-wider">Connected Accounts</span>
                                        <h3 className="text-3xl font-black text-white mt-2">{nodes.length}</h3>
                                    </div>
                                    <div className="bg-[#0a0a0a] border border-neutral-900 p-5 rounded-2xl relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 w-24 h-24 bg-rose-600/5 rounded-full blur-2xl group-hover:bg-rose-600/10 transition"></div>
                                        <span className="text-neutral-500 text-xs uppercase font-bold tracking-wider">Active Processes</span>
                                        <h3 className="text-3xl font-black text-red-500 mt-2">{activeTasks.length}</h3>
                                    </div>
                                    <div className="bg-[#0a0a0a] border border-neutral-900 p-5 rounded-2xl relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 w-24 h-24 bg-emerald-600/5 rounded-full blur-2xl group-hover:bg-emerald-600/10 transition"></div>
                                        <span className="text-neutral-500 text-xs uppercase font-bold tracking-wider">System Uptime</span>
                                        <h3 className="text-xl font-black font-mono text-emerald-400 mt-2">{formatUptime(uptimeSeconds)}</h3>
                                    </div>
                                </div>

                                <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl flex flex-col gap-4 shadow-xl">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest flex items-center gap-2">
                                            <span className="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                                            Live Running Background Processes (Auto-Saved)
                                        </h3>
                                        <span className="text-[10px] text-neutral-500 font-mono">Auto-sync active</span>
                                    </div>
                                    {activeTasks.length === 0 ? (
                                        <div className="py-12 text-center border border-dashed border-neutral-900 rounded-xl">
                                            <p className="text-xs text-neutral-600 italic">No background tasks currently executing.</p>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col gap-2.5">
                                            {activeTasks.map(t => (
                                                <div key={t.task_id} className="flex justify-between items-center bg-black p-4 border border-neutral-900/80 rounded-xl hover:border-neutral-800 transition">
                                                    <div className="text-xs flex items-center gap-4">
                                                        <span className="bg-red-950/80 border border-red-900/50 text-red-400 font-bold px-2.5 py-1 rounded-md text-[10px] tracking-wider">{t.type.toUpperCase()}</span>
                                                        <span className="text-white font-bold">@{t.username}</span>
                                                        <span className="text-neutral-400">Thread: <span className="font-mono text-neutral-300">{t.thread_id || 'Multi-GC Auto'}</span></span>
                                                        <span className="text-neutral-600 text-[10px] font-mono">({t.started_at})</span>
                                                    </div>
                                                    <button onClick={() => stopTask(t.task_id)} className="bg-red-950 hover:bg-red-900 border border-red-900 text-red-200 text-[10px] font-bold px-4 py-2 rounded-lg uppercase tracking-wider transition">Terminate</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ACCOUNTS TAB */}
                        {activeTab === 'accounts' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl flex flex-col gap-5 shadow-xl">
                                    <div>
                                        <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest mb-1">Add Instagram Account</h3>
                                        <p className="text-xs text-neutral-500">Paste your valid sessionid cookie string to initialize node connection.</p>
                                    </div>
                                    <form onSubmit={handleAddAccount} className="flex flex-col gap-3">
                                        <textarea rows="3" placeholder="Paste sessionid cookie..." value={inputSessionId} onChange={e=>setInputSessionId(e.target.value)} className="bg-black border border-neutral-800 rounded-xl p-3.5 text-xs w-full outline-none text-white focus:border-red-600 transition font-mono shadow-inner resize-none"/>
                                        <button type="submit" disabled={isVerifying} className="w-full bg-red-600 hover:bg-red-500 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-red-600/20 active:scale-[0.98]">
                                            {isVerifying ? 'Verifying Node Connection...' : '+ Connect Account Node'}
                                        </button>
                                    </form>
                                </div>

                                <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl flex flex-col gap-4 shadow-xl">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-xs font-bold text-neutral-400 uppercase tracking-widest">Linked Nodes ({nodes.length})</h3>
                                        {nodes.length > 0 && (
                                            <button onClick={toggleSelectAllAccounts} className="text-[10px] bg-neutral-900 hover:bg-neutral-800 text-red-400 border border-neutral-800 px-3 py-1.5 rounded-lg font-bold uppercase transition">Toggle Select All</button>
                                        )}
                                    </div>
                                    {nodes.length === 0 ? (
                                        <div className="py-12 text-center border border-dashed border-neutral-900 rounded-xl">
                                            <p className="text-xs text-neutral-600 italic">No accounts linked in the registry.</p>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col gap-2.5 max-h-72 overflow-y-auto pr-1">
                                            {nodes.map(n => (
                                                <div key={n.id} className="flex justify-between items-center bg-black p-3.5 border border-neutral-900 rounded-xl">
                                                    <div className="flex items-center gap-3 text-xs">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={!!selectedAccountIds[n.id]} 
                                                            onChange={() => toggleAccountSelection(n.id)} 
                                                            className="accent-red-600 cursor-pointer w-4 h-4 rounded"
                                                        />
                                                        <span className="text-white font-bold">@{n.username}</span>
                                                    </div>
                                                    <button onClick={()=>removeAccount(n.id)} className="bg-neutral-900 hover:bg-red-950/60 text-neutral-400 hover:text-red-400 text-[10px] font-bold px-3 py-1.5 rounded-lg border border-neutral-800 transition">Remove</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* MULTI-GC MEGA FIGHT TAB */}
                        {activeTab === 'multigc' && (
                            <div className="flex flex-col gap-6">
                                <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest">1. Connected Sessions Selection</h3>
                                            <p className="text-xs text-neutral-500">Select active nodes to participate in automated Mass GC creation and Mega Fight swarms.</p>
                                        </div>
                                        {nodes.length > 0 && (
                                            <button onClick={toggleSelectAllAccounts} className="text-[10px] bg-neutral-900 hover:bg-neutral-800 text-red-400 border border-neutral-800 px-3 py-1.5 rounded-lg font-bold uppercase transition">Toggle Select All</button>
                                        )}
                                    </div>
                                    {nodes.length === 0 ? (
                                        <p className="text-xs text-neutral-600 italic">No nodes available. Link accounts first.</p>
                                    ) : (
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5 max-h-48 overflow-y-auto">
                                            {nodes.map(n => (
                                                <label key={n.id} className={`flex items-center gap-2.5 p-3 rounded-xl border cursor-pointer transition ${selectedAccountIds[n.id] ? 'bg-red-950/20 border-red-900/50 text-white' : 'bg-black border-neutral-900 text-neutral-400'}`}>
                                                    <input 
                                                        type="checkbox" 
                                                        checked={!!selectedAccountIds[n.id]} 
                                                        onChange={() => toggleAccountSelection(n.id)} 
                                                        className="accent-red-600 w-4 h-4"
                                                    />
                                                    <span className="text-xs font-bold truncate">@{n.username}</span>
                                                </label>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Mass GC Creator Card */}
                                    <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
                                        <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest">2. Mass GC Creator Module</h3>
                                        <div className="flex flex-col gap-3">
                                            <div>
                                                <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Target Prefix</label>
                                                <input type="text" value={massPrefix} onChange={e=>setMassPrefix(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                            </div>
                                            <div>
                                                <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Amount of GCs per Account</label>
                                                <input type="number" value={massAmount} onChange={e=>setMassAmount(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                            </div>
                                            <div>
                                                <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Target Usernames (One per line)</label>
                                                <textarea rows="3" value={massUsernames} onChange={e=>setMassUsernames(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600 resize-none font-mono"/>
                                            </div>
                                            <button onClick={startMassGCCreator} className="w-full bg-red-600 hover:bg-red-500 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-red-600/20 active:scale-[0.98]">
                                                Deploy Mass GC Creator 🔥
                                            </button>
                                        </div>
                                    </div>

                                    {/* Mega Fight Campaign Card */}
                                    <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
                                        <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest">3. Mega Fight Campaign Config</h3>
                                        <div className="flex flex-col gap-3">
                                            <div>
                                                <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Global Target Name</label>
                                                <input type="text" value={globalTargetName} onChange={e=>setGlobalTargetName(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                            </div>
                                            <div>
                                                <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">NC Title Template</label>
                                                <input type="text" value={ncBoxText} onChange={e=>setNcBoxText(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600 font-mono"/>
                                            </div>
                                            <div>
                                                <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Spam Payload Template</label>
                                                <input type="text" value={spamBoxText} onChange={e=>setSpamBoxText(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600 font-mono"/>
                                            </div>
                                            <div>
                                                <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Interval (Seconds)</label>
                                                <input type="number" value={fightInterval} onChange={e=>setFightInterval(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                            </div>
                                            <button onClick={startMultiFight} className="w-full bg-rose-600 hover:bg-rose-500 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-rose-600/20 active:scale-[0.98]">
                                                Launch Mega Fight Campaign 🚀
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* DM SPAM TOOL TAB */}
                        {activeTab === 'spam' && (
                            <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl shadow-xl max-w-2xl flex flex-col gap-5">
                                <div>
                                    <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest">Single DM Spam Tool</h3>
                                    <p className="text-xs text-neutral-500">Execute continuous automated direct message payloads on a specific thread.</p>
                                </div>
                                <div className="flex flex-col gap-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Thread ID</label>
                                            <input type="text" placeholder="e.g. 3410293..." value={spamThread} onChange={e=>setSpamThread(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Jitter / Delay (s)</label>
                                            <input type="number" step="0.5" value={spamJitter} onChange={e=>setSpamJitter(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Target Name</label>
                                        <input type="text" placeholder="e.g. MONARCH" value={spamTargetName} onChange={e=>setSpamTargetName(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Payload Message</label>
                                        <textarea rows="3" placeholder="Enter spam message payload..." value={spamPayload} onChange={e=>setSpamPayload(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600 resize-none font-mono"/>
                                    </div>
                                    <button onClick={startSpam} className="w-full bg-red-600 hover:bg-red-500 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-red-600/20 active:scale-[0.98]">
                                        Launch Spam Campaign 🔥
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* SWARM ATTACK TAB */}
                        {activeTab === 'swarm' && (
                            <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl shadow-xl max-w-2xl flex flex-col gap-5">
                                <div>
                                    <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest">Swarm Attack Module</h3>
                                    <p className="text-xs text-neutral-500">Deploy coordinated spam payloads across all selected connected account nodes simultaneously.</p>
                                </div>
                                <div className="flex flex-col gap-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Thread ID</label>
                                            <input type="text" placeholder="e.g. 3410293..." value={swarmThread} onChange={e=>setSwarmThread(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Jitter / Delay (s)</label>
                                            <input type="number" step="0.5" value={swarmJitter} onChange={e=>setSwarmJitter(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Payload Message</label>
                                        <textarea rows="3" placeholder="Enter swarm message payload..." value={spamPayload} onChange={e=>setSpamPayload(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600 resize-none font-mono"/>
                                    </div>
                                    <button onClick={startSwarmAttack} className="w-full bg-red-600 hover:bg-red-500 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-red-600/20 active:scale-[0.98]">
                                        Deploy Swarm Attack 🐝
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* NC LOCK TAB */}
                        {activeTab === 'nclock' && (
                            <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl shadow-xl max-w-2xl flex flex-col gap-5">
                                <div>
                                    <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest">NC Lock (Group Title) Worker</h3>
                                    <p className="text-xs text-neutral-500">Continuously lock and rotate group chat titles with incremental counters.</p>
                                </div>
                                <div className="flex flex-col gap-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Thread ID</label>
                                            <input type="text" placeholder="e.g. 3410293..." value={ncThread} onChange={e=>setNcThread(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Jitter / Delay (s)</label>
                                            <input type="number" step="0.5" value={ncJitter} onChange={e=>setNcJitter(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">NC Title Base Text</label>
                                        <input type="text" placeholder="e.g. MONARCH SQUAD" value={ncText} onChange={e=>setNcText(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600 font-mono"/>
                                    </div>
                                    <button onClick={startNcLock} className="w-full bg-red-600 hover:bg-red-500 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-red-600/20 active:scale-[0.98]">
                                        Enable NC Lock Worker 🛡️
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* GROUP CREATOR TAB */}
                        {activeTab === 'groups' && (
                            <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl shadow-xl max-w-2xl flex flex-col gap-5">
                                <div>
                                    <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest">Single Group Creator</h3>
                                    <p className="text-xs text-neutral-500">Instantly initialize a new Instagram group chat with target usernames.</p>
                                </div>
                                <form onSubmit={handleCreateGroup} className="flex flex-col gap-4">
                                    <div>
                                        <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Group Title</label>
                                        <input type="text" placeholder="Enter group title..." value={groupTitle} onChange={e=>setGroupTitle(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600"/>
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Member Usernames (One per line)</label>
                                        <textarea rows="4" placeholder="username1&#10;username2" value={groupMembers} onChange={e=>setGroupMembers(e.target.value)} className="w-full bg-black border border-neutral-800 rounded-xl p-3 text-xs text-white outline-none focus:border-red-600 resize-none font-mono"/>
                                    </div>
                                    <button type="submit" disabled={isCreatingGroup} className="w-full bg-red-600 hover:bg-red-500 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-red-600/20 active:scale-[0.98]">
                                        {isCreatingGroup ? 'Creating Group...' : 'Create Group Chat 👥'}
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* ANALYTICS TAB */}
                        {activeTab === 'analytics' && (
                            <div className="bg-[#0a0a0a] border border-neutral-900 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
                                <div>
                                    <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest">System Telemetry & Analytics</h3>
                                    <p className="text-xs text-neutral-500">Live operational logs and real-time execution telemetry.</p>
                                </div>
                                <div className="bg-black border border-neutral-900 rounded-xl p-4 h-72 overflow-y-auto font-mono text-[11px] text-emerald-400 space-y-1.5 shadow-inner">
                                    {logs.length === 0 ? (
                                        <div className="text-neutral-600 italic">[System initialized. Waiting for task telemetry...]</div>
                                    ) : (
                                        logs.map((l, idx) => <div key={idx}>{l}</div>)
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
