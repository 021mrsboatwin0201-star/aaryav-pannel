<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AARYAV PANNEL - Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#070707] text-white font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [loginUser, setLoginUser] = React.useState('');
            const [loginPass, setLoginPass] = React.useState('');
            
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [nodes, setNodes] = React.useState([]);
            const [selectedNodeId, setSelectedNodeId] = React.useState('');
            const [inputSessionId, setInputSessionId] = React.useState('');
            const [isVerifying, setIsVerifying] = React.useState(false);

            // Selected accounts checkboxes state for Multi-GC & Swarm
            const [selectedAccountIds, setSelectedAccountIds] = React.useState({});

            const [statusMsg, setStatusMsg] = React.useState(null);

            const showNotify = (text, type = 'info') => {
                setStatusMsg({ text, type });
                setTimeout(() => setStatusMsg(null), 4000);
            };

            // Spam & Matrix State
            const [spamThread, setSpamThread] = React.useState('');
            const [spamTargetName, setSpamTargetName] = React.useState('');
            const [spamJitter, setSpamJitter] = React.useState('3.5');
            const [spamPayload, setSpamPayload] = React.useState('');
            const [payloadProfile, setPayloadProfile] = React.useState('Aws users');

            // Swarm State
            const [swarmThread, setSwarmThread] = React.useState('');
            const [swarmJitter, setSwarmJitter] = React.useState('3.5');

            // NC Lock State
            const [ncThread, setNcThread] = React.useState('');
            const [ncText, setNcText] = React.useState('');
            const [ncJitter, setNcJitter] = React.useState('4.0');

            // Multi-GC & Mass Creator State
            const [mainFetchSession, setMainFetchSession] = React.useState('');
            const [fetchStatus, setFetchStatus] = React.useState('');
            const [fetchedGCThreads, setFetchedGCThreads] = React.useState([]);
            const [massPrefix, setMassPrefix] = React.useState('MONARCH');
            const [massAmount, setMassAmount] = React.useState('20');
            const [massUsernames, setMassUsernames] = React.useState('hater_target_1\nhater_target_2');
            
            // Custom Multi-GC Fight Templates State
            const [globalTargetName, setGlobalTargetName] = React.useState('MONARCH');
            const [ncBoxText, setNcBoxText] = React.useState('{target} GC LEFT LE RANDIKE {emoji}');
            const [spamBoxText, setSpamBoxText] = React.useState('{target} GC LEFT LE RANDIBALA {emoji}');
            const [fightInterval, setFightInterval] = React.useState('300');

            // Group Creator State
            const [groupTitle, setGroupTitle] = React.useState('');
            const [groupMembers, setGroupMembers] = React.useState('');
            const [isCreatingGroup, setIsCreatingGroup] = React.useState(false);

            const [activeTasks, setActiveTasks] = React.useState([]);
            const [logs, setLogs] = React.useState([]);

            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if(localStorage.getItem('panel_logged') === 'true') setIsLoggedIn(true);
                const saved = localStorage.getItem('panel_nodes');
                if(saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        setNodes(parsed);
                        if(parsed.length > 0) {
                            setSelectedNodeId(parsed[0].id);
                            // Default select all accounts
                            const initialSelected = {};
                            parsed.forEach(n => initialSelected[n.id] = true);
                            setSelectedAccountIds(initialSelected);
                        }
                    } catch(e){}
                }
            }, []);

            React.useEffect(() => {
                if(nodes.length > 0) localStorage.setItem('panel_nodes', JSON.stringify(nodes));
            }, [nodes]);

            React.useEffect(() => {
                if(!isLoggedIn) return;
                const interval = setInterval(() => {
                    fetch('/api/tasks/active')
                    .then(res => res.json())
                    .then(data => {
                        if(data.tasks) setActiveTasks(data.tasks);
                        if(data.logs) setLogs(data.logs);
                    }).catch(()=>{});
                }, 2000);
                return () => clearInterval(interval);
            }, [isLoggedIn]);

            React.useEffect(() => {
                if(activeTab === 'analytics') {
                    const ctx = document.getElementById('statsChart');
                    if(ctx) {
                        if(chartInstance.current) chartInstance.current.destroy();
                        chartInstance.current = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: ['10m ago', '8m ago', '6m ago', '4m ago', '2m ago', 'Now'],
                                datasets: [{
                                    label: 'Messages Sent / min',
                                    data: [12, 28, 45, 60, 85, activeTasks.length > 0 ? 150 : 10],
                                    borderColor: '#dc2626',
                                    backgroundColor: 'rgba(220, 38, 38, 0.1)',
                                    fill: true,
                                    tension: 0.4
                                }]
                            },
                            options: {
                                responsive: true,
                                plugins: { legend: { labels: { color: '#a3a3a3', font: { size: 10 } } } },
                                scales: {
                                    x: { ticks: { color: '#737373', font: { size: 10 } }, grid: { color: '#171717' } },
                                    y: { ticks: { color: '#737373', font: { size: 10 } }, grid: { color: '#171717' } }
                                }
                            }
                        });
                    }
                }
            }, [activeTab, activeTasks]);

            const handleLogin = (e) => {
                e.preventDefault();
                setIsLoggedIn(true);
                localStorage.setItem('panel_logged', 'true');
            };

            const handleAddAccount = (e) => {
                e.preventDefault();
                if(!inputSessionId.trim()) return showNotify('Enter Session ID', 'error');
                setIsVerifying(true);
                fetch('/api/account/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sessionid: inputSessionId.trim() })
                })
                .then(res => res.json())
                .then(data => {
                    setIsVerifying(false);
                    if(data.status === 'success') {
                        const newItem = { id: Date.now().toString(), username: data.username, sessionid: data.sessionid };
                        setNodes(prev => {
                            const updated = [...prev, newItem];
                            return updated;
                        });
                        setSelectedAccountIds(prev => ({ ...prev, [newItem.id]: true }));
                        setSelectedNodeId(newItem.id);
                        setInputSessionId('');
                        showNotify(`Connected @${data.username}`, 'success');
                    } else showNotify(data.message, 'error');
                }).catch(()=>{ setIsVerifying(false); showNotify('Network Error', 'error'); });
            };

            const removeAccount = (id) => {
                setNodes(prev => prev.filter(n => n.id !== id));
                showNotify('Account removed', 'info');
            };

            const toggleAccountSelection = (id) => {
                setSelectedAccountIds(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const toggleSelectAllAccounts = () => {
                const allSelected = nodes.every(n => selectedAccountIds[n.id]);
                const newObj = {};
                nodes.forEach(n => newObj[n.id] = !allSelected);
                setSelectedAccountIds(newObj);
            };

            // Multi-GC Fetcher Action
            const fetchMainGCs = () => {
                if(!mainFetchSession.trim()) return showNotify('Enter Main Account Session ID!', 'error');
                setFetchStatus("Fetching GCs from Instagram...");
                fetch('/api/gcs/fetch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ session_id: mainFetchSession.trim() })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        setFetchedGCThreads(data.gcs.map(g => g.thread_id));
                        setFetchStatus(`Successfully loaded ${data.count} GCs ready for action!`);
                        showNotify(`Fetched ${data.count} GCs successfully!`, 'success');
                    } else {
                        setFetchStatus(`Error: ${data.message}`);
                        showNotify(data.message, 'error');
                    }
                }).catch(() => { setFetchStatus("Network Error!"); showNotify("Network Error!", 'error'); });
            };

            // Mass GC Creator Action
            const startMassGCCreator = () => {
                const accountsToUse = nodes.filter(n => selectedAccountIds[n.id]).map(n => n.sessionid);
                if(accountsToUse.length === 0) return showNotify('Select at least one account via checkboxes!', 'error');
                const usernamesList = massUsernames.split('\n').map(u => u.trim()).filter(u => u);

                fetch('/api/gcs/create_mass', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        accounts: accountsToUse,
                        usernames: usernamesList,
                        target_prefix: massPrefix,
                        amount: parseInt(massAmount) || 20
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') showNotify(data.message, 'success');
                    else showNotify(data.message, 'error');
                });
            };

            // Save NC Templates
            const saveNCText = () => {
                fetch('/api/templates/save_nc', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ nc_text: ncBoxText })
                })
                .then(res => res.json())
                .then(data => showNotify(data.message, 'success'));
            };

            // Save Spam Templates
            const saveSpamText = () => {
                fetch('/api/templates/save_spam', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ spam_text: spamBoxText })
                })
                .then(res => res.json())
                .then(data => showNotify(data.message, 'success'));
            };

            // Start Multi-GC Mega Fight
            const startMultiFight = () => {
                const accountsToUse = nodes.filter(n => selectedAccountIds[n.id]).map(n => ({ username: n.username, sessionid: n.sessionid }));
                if(accountsToUse.length === 0) return showNotify('Select at least one connected session!', 'error');
                if(fetchedGCThreads.length === 0) return showNotify('Fetch GCs first using the Multi-GC Fetcher!', 'error');

                // Auto save templates first just in case
                saveNCText();
                saveSpamText();

                fetch('/api/task/start_multi_fight', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        accounts: accountsToUse,
                        thread_ids: fetchedGCThreads,
                        target_name: globalTargetName,
                        interval: parseInt(fightInterval) || 300
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') showNotify(data.message, 'success');
                    else showNotify(data.message, 'error');
                });
            };

            const startSpam = () => {
                const node = nodes.find(n => n.id === selectedNodeId);
                if(!node) return showNotify('Select an Account first', 'error');
                if(!spamThread || !spamPayload) return showNotify('Fill Thread ID & Payload', 'error');
                
                fetch('/api/task/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        type: 'spam', 
                        session_id: node.sessionid, 
                        username: node.username,
                        thread_id: spamThread, 
                        target: spamTargetName, 
                        jitter: spamJitter, 
                        payload: [spamPayload] 
                    })
                }).then(()=>showNotify('Campaign Launched! 🔥', 'success'));
            };

            const startSwarmAttack = () => {
                const accountsToUse = nodes.filter(n => selectedAccountIds[n.id]);
                if(accountsToUse.length === 0) return showNotify('Select at least one account for Swarm Attack', 'error');
                if(!swarmThread || !spamPayload) return showNotify('Fill Thread ID & Payload', 'error');

                fetch('/api/task/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        type: 'swarm_spam',
                        accounts: accountsToUse,
                        thread_id: swarmThread,
                        target: spamTargetName,
                        jitter: swarmJitter,
                        payload: [spamPayload]
                    })
                }).then(() => showNotify(`🐝 Swarm Attack Deployed across ${accountsToUse.length} accounts!`, 'success'));
            };

            const startNcLock = () => {
                const node = nodes.find(n => n.id === selectedNodeId);
                if(!node) return showNotify('Select an Account first', 'error');
                if(!ncThread || !ncText) return showNotify('Fill Thread ID & Title Base', 'error');
                fetch('/api/task/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        type: 'nclock', session_id: node.sessionid, username: node.username,
                        thread_id: ncThread, jitter: ncJitter, nc_text: ncText
                    })
                }).then(()=>showNotify('NC Lock Worker Enabled!', 'success'));
            };

            const handleCreateGroup = (e) => {
                e.preventDefault();
                const node = nodes.find(n => n.id === selectedNodeId);
                if(!node) return showNotify('Select an Account first', 'error');
                if(!groupTitle || !groupMembers) return showNotify('Enter Title and Usernames', 'error');

                setIsCreatingGroup(true);
                fetch('/api/group/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        session_id: node.sessionid,
                        title: groupTitle,
                        usernames: groupMembers.split('\n')
                    })
                })
                .then(res => res.json())
                .then(data => {
                    setIsCreatingGroup(false);
                    if(data.status === 'success') {
                        showNotify(`Group Created! Thread ID: ${data.thread_id}`, 'success');
                        setGroupTitle('');
                        setGroupMembers('');
                    } else showNotify(data.message, 'error');
                }).catch(()=>{ setIsCreatingGroup(false); showNotify('Error creating group', 'error'); });
            };

            const stopTask = (tid) => {
                fetch('/api/task/stop', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ task_id: tid })
                }).then(() => showNotify('Task Terminated', 'info'));
            };

            if(!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-black">
                        <form onSubmit={handleLogin} className="bg-[#111] border border-neutral-800 p-8 rounded-2xl w-full max-w-sm flex flex-col gap-4 shadow-2xl">
                            <h1 className="text-xl font-black text-red-600 uppercase text-center tracking-wider">AARYAV PANNEL</h1>
                            <p className="text-xs text-neutral-500 text-center mb-2">Secure Automation Suite</p>
                            <input type="text" placeholder="Username" value={loginUser} onChange={e=>setLoginUser(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs outline-none text-white focus:border-red-600"/>
                            <input type="password" placeholder="Password" value={loginPass} onChange={e=>setLoginPass(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs outline-none text-white focus:border-red-600"/>
                            <button type="submit" className="py-3 bg-red-600 font-bold text-xs uppercase rounded hover:bg-red-700 transition">Access Panel</button>
                        </form>
                    </div>
                );
            }

            const activeNode = nodes.find(n => n.id === selectedNodeId);

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-[#070707]">
                    {/* Sidebar Navigation */}
                    <aside className="w-full md:w-64 bg-[#111] border-r border-neutral-900 flex flex-col justify-between p-4">
                        <div>
                            <div className="py-4 px-2 mb-4 border-b border-neutral-900">
                                <h1 className="text-lg font-black text-red-600 tracking-wider">AARYAV PANNEL</h1>
                                <p className="text-[10px] text-emerald-500 font-bold mt-0.5">● SYSTEM ONLINE</p>
                            </div>
                            <nav className="flex flex-col gap-1.5">
                                <button onClick={()=>setActiveTab('dashboard')} className={`text-left px-3 py-2.5 rounded text-xs font-bold uppercase transition ${activeTab==='dashboard'?'bg-red-600 text-white':'text-neutral-400 hover:bg-neutral-900'}`}>📊 Dashboard</button>
                                <button onClick={()=>setActiveTab('accounts')} className={`text-left px-3 py-2.5 rounded text-xs font-bold uppercase transition ${activeTab==='accounts'?'bg-red-600 text-white':'text-neutral-400 hover:bg-neutral-900'}`}>👤 Accounts Manager</button>
                                <button onClick={()=>setActiveTab('multigc')} className={`text-left px-3 py-2.5 rounded text-xs font-bold uppercase transition ${activeTab==='multigc'?'bg-red-600 text-white':'text-neutral-400 hover:bg-neutral-900'}`}>🔥 Multi-GC Mega Fight</button>
                                <button onClick={()=>setActiveTab('spam')} className={`text-left px-3 py-2.5 rounded text-xs font-bold uppercase transition ${activeTab==='spam'?'bg-red-600 text-white':'text-neutral-400 hover:bg-neutral-900'}`}>⚡ DM Spam Tool</button>
                                <button onClick={()=>setActiveTab('swarm')} className={`text-left px-3 py-2.5 rounded text-xs font-bold uppercase transition ${activeTab==='swarm'?'bg-red-600 text-white':'text-neutral-400 hover:bg-neutral-900'}`}>🐝 Swarm Attack</button>
                                <button onClick={()=>setActiveTab('nclock')} className={`text-left px-3 py-2.5 rounded text-xs font-bold uppercase transition ${activeTab==='nclock'?'bg-red-600 text-white':'text-neutral-400 hover:bg-neutral-900'}`}>🛡️ NC Lock (Title)</button>
                                <button onClick={()=>setActiveTab('groups')} className={`text-left px-3 py-2.5 rounded text-xs font-bold uppercase transition ${activeTab==='groups'?'bg-red-600 text-white':'text-neutral-400 hover:bg-neutral-900'}`}>👥 Group Creator</button>
                                <button onClick={()=>setActiveTab('analytics')} className={`text-left px-3 py-2.5 rounded text-xs font-bold uppercase transition ${activeTab==='analytics'?'bg-red-600 text-white':'text-neutral-400 hover:bg-neutral-900'}`}>📈 Analytics & Charts</button>
                            </nav>
                        </div>
                        <div className="pt-4 border-t border-neutral-900 flex flex-col gap-3">
                            <div className="bg-black p-2.5 rounded border border-neutral-900 text-[11px]">
                                <span className="text-neutral-500 block">Active Account:</span>
                                <span className="text-red-500 font-bold">{activeNode ? '@'+activeNode.username : 'None Selected'}</span>
                            </div>
                            <button onClick={()=>{setIsLoggedIn(false); localStorage.removeItem('panel_logged');}} className="bg-neutral-900 hover:bg-neutral-800 text-neutral-400 py-2 rounded text-xs font-bold uppercase">Logout</button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 flex flex-col gap-6 max-w-5xl mx-auto w-full">
                        {statusMsg && (
                            <div className={`p-3.5 rounded-xl text-xs font-bold flex items-center justify-between transition ${statusMsg.type === 'error' ? 'bg-red-950 border border-red-800 text-red-200' : statusMsg.type === 'success' ? 'bg-emerald-950 border border-emerald-800 text-emerald-200' : 'bg-neutral-900 border border-neutral-700 text-neutral-200'}`}>
                                <span>{statusMsg.text}</span>
                                <button onClick={()=>setStatusMsg(null)} className="text-xs opacity-60 hover:opacity-100">✕</button>
                            </div>
                        )}

                        <header className="flex justify-between items-center bg-[#111] border border-neutral-900 p-4 rounded-xl">
                            <div>
                                <h2 className="text-sm font-black uppercase tracking-wider text-red-500">{activeTab.toUpperCase()} PANEL</h2>
                                <p className="text-xs text-neutral-500">Manage automation tasks and active threads effortlessly.</p>
                            </div>
                            <div className="flex items-center gap-2">
                                <span className="text-xs text-neutral-400">Selected ID:</span>
                                <select value={selectedNodeId} onChange={e=>setSelectedNodeId(e.target.value)} className="bg-black border border-neutral-800 rounded px-2.5 py-1 text-xs text-red-400 font-bold outline-none">
                                    {nodes.length === 0 ? <option>No Accounts Added</option> : nodes.map(n => <option key={n.id} value={n.id}>@{n.username}</option>)}
                                </select>
                            </div>
                        </header>

                        {/* DASHBOARD TAB */}
                        {activeTab === 'dashboard' && (
                            <div className="flex flex-col gap-6">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="bg-[#111] border border-neutral-900 p-4 rounded-xl">
                                        <span className="text-neutral-500 text-xs uppercase font-bold">Connected Accounts</span>
                                        <h3 className="text-2xl font-black text-white mt-1">{nodes.length}</h3>
                                    </div>
                                    <div className="bg-[#111] border border-neutral-900 p-4 rounded-xl">
                                        <span className="text-neutral-500 text-xs uppercase font-bold">Active Processes</span>
                                        <h3 className="text-2xl font-black text-red-500 mt-1">{activeTasks.length}</h3>
                                    </div>
                                    <div className="bg-[#111] border border-neutral-900 p-4 rounded-xl">
                                        <span className="text-neutral-500 text-xs uppercase font-bold">Server Uptime</span>
                                        <h3 className="text-2xl font-black text-emerald-500 mt-1">Operational</h3>
                                    </div>
                                </div>

                                <div className="bg-[#111] border border-neutral-900 p-5 rounded-xl flex flex-col gap-3">
                                    <h3 className="text-xs font-bold text-red-500 uppercase">Live Running Background Processes</h3>
                                    {activeTasks.length === 0 ? (
                                        <p className="text-xs text-neutral-600 italic">No tasks currently active.</p>
                                    ) : (
                                        <div className="flex flex-col gap-2">
                                            {activeTasks.map(t => (
                                                <div key={t.task_id} className="flex justify-between items-center bg-black p-3 border border-neutral-900 rounded-lg">
                                                    <div className="text-xs flex items-center gap-3">
                                                        <span className="bg-red-950 text-red-400 font-bold px-2 py-0.5 rounded text-[10px]">{t.type.toUpperCase()}</span>
                                                        <span className="text-neutral-300 font-bold">@{t.username}</span>
                                                        <span className="text-neutral-500">Thread: {t.thread_id || 'Multi-GC'}</span>
                                                        <span className="text-neutral-600 text-[10px]">({t.started_at})</span>
                                                    </div>
                                                    <button onClick={() => stopTask(t.task_id)} className="bg-red-900 hover:bg-red-700 text-white text-[10px] font-bold px-3 py-1.5 rounded uppercase transition">Terminate</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ACCOUNTS TAB */}
                        {activeTab === 'accounts' && (
                            <div className="bg-[#111] border border-neutral-900 p-6 rounded-xl flex flex-col gap-6 max-w-2xl">
                                <div>
                                    <h3 className="text-sm font-bold text-red-500 uppercase mb-1">Add Instagram Account</h3>
                                    <p className="text-xs text-neutral-500 mb-4">Paste sessionid cookie below to link account.</p>
                                    <form onSubmit={handleAddAccount} className="flex gap-2">
                                        <input type="text" placeholder="Paste sessionid..." value={inputSessionId} onChange={e=>setInputSessionId(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs flex-1 outline-none text-white focus:border-red-600"/>
                                        <button type="submit" disabled={isVerifying} className="bg-red-600 text-white px-5 py-3 rounded text-xs font-bold hover:bg-red-700 transition">{isVerifying ? 'Verifying...' : '+ Connect ID'}</button>
                                    </form>
                                </div>

                                <div className="border-t border-neutral-900 pt-4">
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="text-xs font-bold text-neutral-400 uppercase">Linked Accounts List ({nodes.length})</h3>
                                        {nodes.length > 0 && (
                                            <button onClick={toggleSelectAllAccounts} className="text-[10px] bg-neutral-900 hover:bg-neutral-800 text-red-400 px-2.5 py-1 rounded font-bold uppercase">Toggle Select All</button>
                                        )}
                                    </div>
                                    {nodes.length === 0 ? (
                                        <p className="text-xs text-neutral-600 italic">No accounts linked yet.</p>
                                    ) : (
                                        <div className="flex flex-col gap-2 max-h-60 overflow-y-auto">
                                            {nodes.map(n => (
                                                <div key={n.id} className="flex justify-between items-center bg-black p-3 border border-neutral-900 rounded-lg">
                                                    <div className="flex items-center gap-3 text-xs">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={!!selectedAccountIds[n.id]} 
                                                            onChange={() => toggleAccountSelection(n.id)} 
                                                            className="accent-red-600 cursor-pointer w-4 h-4"
                                                        />

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                {nodes.map(n => (

                                                            checked={!!selectedAccountIds[n.id]}

                                        )}

                                </div>

                                {/* Main Account GC Fetcher */}
                                <div className="bg-[#111] border border-neutral-900 p-6 rounded-xl">
                                    <h3 className="text-sm font-bold text-red-500 uppercase mb-1">2. Multi-GC Fetcher (Load All GCs)</h3>

                                    <div className="flex gap-2">
                                        <input type="text" placeholder="Main Account Session ID..." value={mainFetchSession} onChange={e=>setMainFetchSession(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs flex-1 outline-none text-white"/>

                                    </div>
                                    {fetchStatus && <p className="mt-3 text-xs font-bold text-emerald-400">{fetchStatus}</p>}
                                </div>

                                {/* Automated Mass GC Creator */}
                                <div className="bg-[#111] border border-neutral-900 p-6 rounded-xl">
                                    <h3 className="text-sm font-bold text-red-500 uppercase mb-1">3. Automated Mass GC Creator (Smart Fallback)</h3>
                                    <p className="text-xs text-neutral-500 mb-4">Creates multiple GCs using selected checked accounts with smart random user fallback.</p>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <label className="text-[11px] text-neutral-400 mb-1 block">Target Name Prefix</label>
                                            <input type="text" value={massPrefix} onChange={e=>setMassPrefix(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                        </div>
                                        <div>
                                            <label className="text-[11px] text-neutral-400 mb-1 block">Total GCs Amount</label>
                                            <input type="number" value={massAmount} onChange={e=>setMassAmount(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                        </div>
                                    </div>
                                    <div className="mb-4">
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Base Usernames (One per line)</label>
                                        <textarea rows="3" value={massUsernames} onChange={e=>setMassUsernames(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white font-mono"></textarea>

                                    <button onClick={startMassGCCreator} className="py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs uppercase rounded transition">Start Mass GC Creation</button>

                                    <h3 className="text-sm font-bold text-red-500 uppercase mb-1">4. Multi-GC Mega Fight Control</h3>

                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <label className="text-[11px] text-emerald-400 font-bold mb-1 block">NC Template (Use &#123;target&#125; & &#123;emoji&#125;)</label>
                                            <textarea rows="4" value={ncBoxText} onChange={e=>setNcBoxText(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white font-mono mb-2"></textarea>
                                            <button onClick={saveNCText} className="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold px-4 py-2 rounded">Save NC Text</button>
                                        </div>
                                        <div>
                                            <label className="text-[11px] text-red-400 font-bold mb-1 block">Spam Template (Use &#123;target&#125; & &#123;emoji&#125;)</label>
                                            <textarea rows="4" value={spamBoxText} onChange={e=>setSpamBoxText(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white font-mono mb-2"></textarea>
                                            <button onClick={saveSpamText} className="bg-red-700 hover:bg-red-800 text-white text-xs font-bold px-4 py-2 rounded">Save Spam Text</button>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-4 pt-4 border-t border-neutral-800">
                                        <div>
                                            <label className="text-[11px] text-neutral-400 mb-1 block">Interval (Seconds)</label>
                                            <input type="number" value={fightInterval} onChange={e=>setFightInterval(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-32 outline-none text-white"/>
                                        </div>
                                        <button onClick={startMultiFight} className="flex-1 py-3.5 bg-red-600 hover:bg-red-700 text-white font-black text-sm uppercase rounded transition tracking-wider shadow-lg">START MULTI-GC MEGA FIGHT 🔥</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* SPAM TAB */}
                        {activeTab === 'spam' && (
                            <div className="bg-[#111] border border-neutral-900 p-6 rounded-xl flex flex-col gap-4 max-w-2xl">
                                <h3 className="text-sm font-bold text-red-500 uppercase">Direct Message Campaign & Matrix</h3>
                                <div className="flex flex-col gap-3">
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Target Thread / Group ID</label>
                                        <input type="text" placeholder="e.g. 3402823668..." value={spamThread} onChange={e=>setSpamThread(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Target Username (For &#123;target&#125; replacement)</label>
                                        <input type="text" placeholder="e.g. target_username" value={spamTargetName} onChange={e=>setSpamTargetName(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Delay Interval (Seconds)</label>
                                        <input type="text" placeholder="3.5" value={spamJitter} onChange={e=>setSpamJitter(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Payload Profile Matrix</label>
                                        <select 
                                            value={payloadProfile} 
                                            onChange={e => {
                                                const val = e.target.value;
                                                setPayloadProfile(val);
                                                if (val === 'Aws users') {
                                                    setSpamPayload(
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target}  AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭\n\n\n\n" +
                                                        "{target} AWS USER LOLIPOP CHUS 🫧☆⊰⊱𑁍ࠬܓ✞🍭"
                                                    );
                                                }
                                                else if (val === 'Bada ho') {
                                                    setSpamPayload(
                                                        "{target}  Lᴜɴᴅ ᴄʜᴜs ᴋᴇ ʙᴀᴅᴀ ʜᴏ 𑁍ࠬܓ<💚>\n\n\n\n" +
                                                        "{target}  Lᴜɴᴅ ᴄʜᴜs ᴋᴇ ʙᴀᴅᴀ ʜᴏ 𑁍ࠬܓ<💚>\n\n\n\n" +
                                                        "{target}  Lᴜɴᴅ ᴄʜᴜs ᴋᴇ ʙᴀᴅᴀ ʜᴏ 𑁍ࠬܓ<💚>\n\n\n\n" +
                                                        "{target}  Lᴜɴᴅ ᴄʜᴜs ᴋᴇ ʙᴀᴅᴀ ʜᴏ 𑁍ࠬܓ<💚>\n\n\n\n" +
                                                        "{target}  Lᴜɴᴅ ᴄʜᴜs ᴋᴇ ʙᴀᴅᴀ ʜᴏ 𑁍ࠬܓ<💚>\n\n\n\n" +
                                                        "{target}  Lᴜɴᴅ ᴄʜᴜs ᴋᴇ ʙᴀᴅᴀ ʜᴏ 𑁍ࠬܓ<💚>\n\n\n\n" +
                                                        "{target}  Lᴜɴᴅ ᴄʜᴜs ᴋᴇ ʙᴀᴅᴀ ʜᴏ 𑁍ࠬܓ<💚>\n\n\n\n" +
                                                        "{target}  Lᴜɴᴅ ᴄʜᴜs ᴋᴇ ʙᴀᴅᴀ ʜᴏ 𑁍ࠬܓ<💚>"
                                                    );
                                                }
                                                else if (val === 'Run') {
                                                    setSpamPayload(
                                                        "{target} 𝘽𝙃𝘼𝙂 𝙈𝘼𝙏\n\n\n\n\n\n\n" +
                                                        "{target} 𝘽𝙃𝘼𝙂 𝙈𝘼𝙏\n\n\n\n\n\n\n" +
                                                        "{target} 𝘽𝙃𝘼𝙂 𝙈𝘼𝙏\n\n\n\n\n\n\n" +
                                                        "{target} 𝘽𝙃𝘼𝙂 𝙈𝘼𝙏"
                                                    );
                                                }
                                                else if (val === 'tmkc') {
                                                    setSpamPayload(
                                                        "{target} ＲＡＮＤＡＬＴＭＫＣ/－🎀⃤\n\n\n\n\n\n\n" +
                                                        "{target} ＲＡＮＤＡＬＴＭＫＣ/－🎀⃤"
                                                    );
                                                }
                                                else if (val === 'json' || val === 'custom') setSpamPayload(""); 
                                            }} 
                                            className="bg-black border border-neutral-800 rounded p-3 text-xs w-full text-red-400 font-bold outline-none"
                                        >
                                            <option value="Aws users">Profile Aws (Lollipop chus)</option>
                                            <option value="Bada ho">Profile Big (Bada ho)</option>
                                            <option value="Run">Profile Run (Bhag randike)</option>
                                            <option value="tmkc">Profile Tmkc (Tmkc)</option>

                                            <label className="text-[10px] text-neutral-400 uppercase font-bold">Upload JSON Payload File</label>
                                            <input 
                                                type="file" 
                                                accept=".json" 
                                                onChange={e => {
                                                    const file = e.target.files[0];
                                                    if(file) {
                                                        const reader = new FileReader();
                                                        reader.onload = (ev) => {
                                                            try {
                                                                const jsonData = JSON.parse(ev.target.result);
                                                                const messages = Array.isArray(jsonData) ? jsonData.join('\n\n') : (jsonData.messages ? jsonData.messages.join('\n\n') : JSON.stringify(jsonData, null, 2));
                                                                setSpamPayload(messages);
                                                                showNotify('JSON payload loaded!', 'success');

                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Message Payload Lines / Custom Text</label>
                                        <textarea rows="6" value={spamPayload} onChange={e=>setSpamPayload(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white font-mono"></textarea>

                                    <button onClick={startSpam} className="py-3 bg-red-600 font-bold text-xs uppercase rounded hover:bg-red-700 transition">Launch Single Campaign</button>
                                </div>
                            </div>

                        {/* SWARM ATTACK TAB */}
                        {activeTab === 'swarm' && (
                            <div className="bg-[#111] border border-neutral-900 p-6 rounded-xl flex flex-col gap-4 max-w-2xl">
                                <h3 className="text-sm font-bold text-red-500 uppercase">🐝 Account Swarm Attack (Simultaneous Raid)</h3>
                                <p className="text-xs text-neutral-500">This will launch your selected checked accounts simultaneously onto a single target thread!</p>
                                <div className="flex flex-col gap-3">
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Target Thread ID</label>
                                        <input type="text" placeholder="e.g. 3402823668..." value={swarmThread} onChange={e=>setSwarmThread(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Delay Jitter (Seconds)</label>
                                        <input type="text" value={swarmJitter} onChange={e=>setSwarmJitter(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Active Payload (Uses current Spam Payload text)</label>
                                        <textarea rows="4" value={spamPayload} onChange={e=>setSpamPayload(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white font-mono"></textarea>
                                    </div>
                                    <button onClick={startSwarmAttack} className="py-3 bg-red-600 font-bold text-xs uppercase rounded hover:bg-red-700 transition">🚀 Launch Swarm Attack</button>
                                </div>
                            </div>
                        )}

                        {/* NC LOCK TAB */}
                        {activeTab === 'nclock' && (
                            <div className="bg-[#111] border border-neutral-900 p-6 rounded-xl flex flex-col gap-4 max-w-2xl">
                                <h3 className="text-sm font-bold text-red-500 uppercase">NC Lock (Group Title Rotation)</h3>
                                <div className="flex flex-col gap-3">
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Target Thread ID</label>
                                        <input type="text" placeholder="Thread ID..." value={ncThread} onChange={e=>setNcThread(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Title Base</label>
                                        <input type="text" placeholder="e.g. AARYAV ON TOP" value={ncText} onChange={e=>setNcText(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Rotation Jitter (Seconds)</label>
                                        <input type="text" value={ncJitter} onChange={e=>setNcJitter(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                    </div>
                                    <button onClick={startNcLock} className="py-3 bg-red-600 font-bold text-xs uppercase rounded hover:bg-red-700 transition">Activate NC Lock</button>
                                </div>
                            </div>
                        )}

                        {/* GROUPS TAB */}
                        {activeTab === 'groups' && (
                            <div className="bg-[#111] border border-neutral-900 p-6 rounded-xl flex flex-col gap-4 max-w-2xl">
                                <h3 className="text-sm font-bold text-red-500 uppercase">Group Creator Suite</h3>
                                <form onSubmit={handleCreateGroup} className="flex flex-col gap-3">
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Group Title</label>
                                        <input type="text" placeholder="Title..." value={groupTitle} onChange={e=>setGroupTitle(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white"/>
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-neutral-400 mb-1 block">Member Usernames (one per line)</label>
                                        <textarea rows="4" placeholder="user1\nuser2" value={groupMembers} onChange={e=>setGroupMembers(e.target.value)} className="bg-black border border-neutral-800 rounded p-3 text-xs w-full outline-none text-white font-mono"></textarea>
                                    </div>
                                    <button type="submit" disabled={isCreatingGroup} className="py-3 bg-red-600 font-bold text-xs uppercase rounded hover:bg-red-700 transition">{isCreatingGroup ? 'Forging Group...' : 'Create Group Thread'}</button>
                                </form>
                            </div>
                        )}

                        {/* ANALYTICS TAB */}
                        {activeTab === 'analytics' && (
                            <div className="bg-[#111] border border-neutral-900 p-6 rounded-xl flex flex-col gap-6 max-w-3xl w-full">
                                <h3 className="text-sm font-bold text-red-500 uppercase">📈 Live Performance Analytics & Charts</h3>
                                <div className="bg-black border border-neutral-800 p-4 rounded-xl">
                                    <canvas id="statsChart" className="w-full h-64"></canvas>
                                </div>
                                <div className="flex flex-col gap-2">
                                    <h4 className="text-xs font-bold text-neutral-400 uppercase">System Logs Stream</h4>
                                    <div className="bg-black border border-neutral-800 rounded p-3 h-48 overflow-y-auto font-mono text-[11px] text-neutral-400 flex flex-col gap-1">
                                        {logs.length === 0 ? (
                                            <span className="text-neutral-600 italic">No activity logs recorded yet...</span>
                                        ) : (
                                            logs.map((log, index) => <div key={index}>{log}</div>)
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
