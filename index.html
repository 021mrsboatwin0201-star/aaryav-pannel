<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AARYAV PANNEL SPAM IG</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDNs for browser execution -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0a0a0a] text-white font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('control');
            const [activeNode, setActiveNode] = React.useState('node1');
            const [targetThread, setTargetThread] = React.useState('');
            const [payloadLines, setPayloadLines] = React.useState('🔥 AARYAV SPAM ACTIVE 🔥');
            const [jitterDelay, setJitterDelay] = React.useState('3.5');
            const [isSpamming, setIsSpamming] = React.useState(false);
            
            // NC Lock State
            const [ncText, setNcText] = React.useState('');
            const [ncActive, setNcActive] = React.useState(false);
            const [selectedNcNodes, setSelectedNcNodes] = React.useState({ node1: true, node2: false });

            return (
                <div className="min-h-screen bg-[#0a0a0a] text-white p-4 flex flex-col">
                    {/* Header */}
                    <header className="border-b border-red-900/60 pb-4 mb-4 flex flex-col md:flex-row justify-between items-center gap-4 bg-[#141414] p-4 rounded-xl shadow-[0_0_20px_rgba(255,0,60,0.15)]">
                        <div>
                            <h1 className="text-2xl font-black tracking-wider text-red-600 uppercase">AARYAV PANNEL SPAM IG</h1>
                            <p className="text-xs text-neutral-400">Owner: <span className="text-red-400 font-bold">@Abusivegang</span> | Operator: S</p>
                        </div>
                        <div className="flex gap-2 bg-[#0a0a0a] p-1.5 rounded-lg border border-red-900/40">
                            <button onClick={() => setActiveTab('control')} className={`px-4 py-2 rounded font-bold text-xs transition ${activeTab === 'control' ? 'bg-red-600 text-white shadow-[0_0_10px_#ff003c]' : 'text-neutral-400 hover:text-white'}`}>Control Center</button>
                            <button onClick={() => setActiveTab('matrix')} className={`px-4 py-2 rounded font-bold text-xs transition ${activeTab === 'matrix' ? 'bg-red-600 text-white shadow-[0_0_10px_#ff003c]' : 'text-neutral-400 hover:text-white'}`}>Nodes Matrix</button>
                        </div>
                    </header>

                    {/* Main Content */}
                    {activeTab === 'control' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 flex-1">
                            {/* Left Config Panel */}
                            <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex flex-col gap-4 shadow-xl">
                                <h2 className="text-sm font-bold text-red-500 uppercase tracking-widest border-b border-red-950 pb-2">Node Selector</h2>
                                <div className="flex gap-2">
                                    <button onClick={() => setActiveNode('node1')} className={`flex-1 py-2 text-xs font-bold rounded border ${activeNode === 'node1' ? 'bg-red-950/40 border-red-600 text-red-400' : 'border-neutral-800 text-neutral-500'}`}>Node 1 (@Abusivegang)</button>
                                    <button onClick={() => setActiveNode('node2')} className={`flex-1 py-2 text-xs font-bold rounded border ${activeNode === 'node2' ? 'bg-red-950/40 border-red-600 text-red-400' : 'border-neutral-800 text-neutral-500'}`}>Node 2 (@Yachudnangi)</button>
                                </div>

                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs text-neutral-400 font-semibold">Target GC Thread ID</label>
                                    <input type="text" placeholder="Enter Thread ID / Group URL" value={targetThread} onChange={(e) => setTargetThread(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs text-white focus:border-red-600 outline-none" />
                                </div>

                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs text-neutral-400 font-semibold">Jitter Delay Pacing (Seconds)</label>
                                    <input type="text" value={jitterDelay} onChange={(e) => setJitterDelay(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs text-white focus:border-red-600 outline-none" />
                                </div>

                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs text-neutral-400 font-semibold">Spam Payload Lines</label>
                                    <textarea rows="3" value={payloadLines} onChange={(e) => setPayloadLines(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs text-white focus:border-red-600 outline-none resize-none"></textarea>
                                </div>

                                <button onClick={() => setIsSpamming(!isSpamming)} className={`w-full py-3 rounded font-bold text-sm tracking-wider uppercase transition ${isSpamming ? 'bg-neutral-900 border border-red-600 text-red-500 animate-pulse' : 'bg-red-600 hover:bg-red-700 text-white shadow-[0_0_15px_rgba(255,0,60,0.4)]'}`}>
                                    {isSpamming ? 'HALT SPAM CAMPAIGN' : 'LAUNCH SPAM CAMPAIGN'}
                                </button>
                            </div>

                            {/* Center/Right: NC Lock System with ID Selection */}
                            <div className="lg:col-span-2 flex flex-col gap-4">
                                <div className="bg-[#141414] border border-red-950 p-4 rounded-xl shadow-xl">
                                    <h2 className="text-sm font-bold text-red-500 uppercase tracking-widest border-b border-red-950 pb-2 mb-3">Group Name Protection (NC Lock)</h2>
                                    
                                    <div className="flex flex-col gap-3">
                                        <div>
                                            <label className="text-xs text-neutral-400 font-semibold block mb-1">Select Active IDs for NC Lock</label>
                                            <div className="flex gap-4">
                                                <label className="flex items-center gap-2 text-xs cursor-pointer">
                                                    <input type="checkbox" checked={selectedNcNodes.node1} onChange={(e) => setSelectedNcNodes({...selectedNcNodes, node1: e.target.checked})} className="accent-red-600" /> @Abusivegang
                                                </label>
                                                <label className="flex items-center gap-2 text-xs cursor-pointer">
                                                    <input type="checkbox" checked={selectedNcNodes.node2} onChange={(e) => setSelectedNcNodes({...selectedNcNodes, node2: e.target.checked})} className="accent-red-600" /> @Yachudnangi
                                                </label>
                                            </div>
                                        </div>

                                        <div className="flex flex-col gap-1.5">
                                            <label className="text-xs text-neutral-400 font-semibold">Protected Group Title Base</label>
                                            <input type="text" placeholder="e.g. AARYAV SQUAD 👑" value={ncText} onChange={(e) => setNcText(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs text-white focus:border-red-600 outline-none" />
                                            <p className="text-[10px] text-neutral-500">Auto-rotating suffix emojis will cycle: 💕, 🔥, ✨, 👑, ⚡, 😈</p>
                                        </div>

                                        <button onClick={() => setNcActive(!ncActive)} className={`py-2.5 rounded font-bold text-xs uppercase tracking-wider transition ${ncActive ? 'bg-red-900 text-white' : 'bg-neutral-800 hover:bg-neutral-700 text-red-400 border border-red-900/50'}`}>
                                            {ncActive ? 'Disable NC Lock' : 'Activate NC Lock'}
                                        </button>
                                    </div>
                                </div>

                                {/* Terminal Telemetry */}
                                <div className="bg-black border border-red-950 p-3 rounded-xl flex-1 font-mono text-[11px] h-48 overflow-y-auto text-red-500 shadow-inner">
                                    <div className="text-neutral-600 border-b border-neutral-900 pb-1 mb-2">[SYSTEM TELEMETRY LOGS - @ABUSIVEGANG]</div>
                                    <div>[09:35:00] [@Abusivegang] Node initialized successfully.</div>
                                    {isSpamming && <div className="text-red-400">[09:35:12] [DISPATCH] Target GC hooked with jitter {jitterDelay}s...</div>}
                                    {ncActive && <div className="text-yellow-500">[09:35:15] [NC LOCK] Rotating title suffixes active with selected IDs.</div>}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex-1">
                            <h2 className="text-sm font-bold text-red-500 uppercase tracking-widest mb-4">Active Nodes Matrix</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-black border border-neutral-800 p-4 rounded-lg">
                                    <div className="font-bold text-red-400 text-sm">Node ID: @Abusivegang</div>
                                    <div className="text-xs text-neutral-400 mt-2">Status: <span className="text-emerald-500 font-bold">ONLINE</span></div>
                                    <div className="text-xs text-neutral-400 mt-1">Dispatched Count: 1,420 msgs</div>
                                </div>
                                <div className="bg-black border border-neutral-800 p-4 rounded-lg">
                                    <div className="font-bold text-red-400 text-sm">Node ID: @Yachudnangi</div>
                                    <div className="text-xs text-neutral-400 mt-2">Status: <span className="text-emerald-500 font-bold">ONLINE</span></div>
                                    <div className="text-xs text-neutral-400 mt-1">Dispatched Count: 890 msgs</div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
