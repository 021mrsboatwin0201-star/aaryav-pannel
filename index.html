<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AARYAV PANNEL SPAM IG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0a0a] text-white font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [authView, setAuthView] = React.useState('signin');
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [loginUsername, setLoginUsername] = React.useState('');
            const [loginPassword, setLoginPassword] = React.useState('');
            const [regUsername, setRegUsername] = React.useState('');
            const [regPassword, setRegPassword] = React.useState('');

            const [nodes, setNodes] = React.useState([]);
            const [selectedNodeId, setSelectedNodeId] = React.useState('');
            const [inputSessionId, setInputSessionId] = React.useState('');
            const [isVerifying, setIsVerifying] = React.useState(false);

            // Spam State
            const [spamThread, setSpamThread] = React.useState('');
            const [spamJitter, setSpamJitter] = React.useState('3.5');
            const [spamPayload, setSpamPayload] = React.useState('');
            const [isSpamming, setIsSpamming] = React.useState(false);

            // NC Lock State
            const [ncThread, setNcThread] = React.useState('');
            const [ncText, setNcText] = React.useState('');
            const [ncJitter, setNcJitter] = React.useState('4.0');
            const [ncActive, setNcActive] = React.useState(false);

            const [logs, setLogs] = React.useState([]);

            // Auto-login & load saved nodes from localStorage on startup
            React.useEffect(() => {
                const savedAuth = localStorage.getItem('panel_logged_in');
                if (savedAuth === 'true') {
                    setIsLoggedIn(true);
                }
                const savedNodes = localStorage.getItem('panel_nodes');
                if (savedNodes) {
                    try {
                        const parsed = JSON.parse(savedNodes);
                        setNodes(parsed);
                        if(parsed.length > 0) setSelectedNodeId(parsed[0].id);
                    } catch(e) {}
                }
            }, []);

            // Save nodes to localStorage whenever they change
            React.useEffect(() => {
                if(nodes.length > 0) {
                    localStorage.setItem('panel_nodes', JSON.stringify(nodes));
                }
            }, [nodes]);

            // Sync logs
            React.useEffect(() => {
                if(!isLoggedIn) return;
                const interval = setInterval(() => {
                    fetch('/api/logs')
                        .then(res => res.json())
                        .then(data => {
                            if(data.logs) setLogs(data.logs);
                            if(data.active_tasks) {
                                if(data.active_tasks['spam_task'] !== undefined) setIsSpamming(data.active_tasks['spam_task']);
                                if(data.active_tasks['nc_task'] !== undefined) setNcActive(data.active_tasks['nc_task']);
                            }
                        })
                        .catch(() => {});
                }, 2000);
                return () => clearInterval(interval);
            }, [isLoggedIn]);

            const handleSignIn = (e) => {
                e.preventDefault();
                const savedUser = localStorage.getItem('panel_user');
                const savedPass = localStorage.getItem('panel_pass');
                if (savedUser && loginUsername === savedUser && loginPassword === savedPass) {
                    setIsLoggedIn(true);
                    localStorage.setItem('panel_logged_in', 'true');
                } else if (!savedUser) {
                    alert('No account found! Please Sign Up first.');
                } else {
                    alert('Invalid credentials!');
                }
            };

            const handleSignUp = (e) => {
                e.preventDefault();
                if(!regUsername || !regPassword) return alert('Fill all fields');
                localStorage.setItem('panel_user', regUsername);
                localStorage.setItem('panel_pass', regPassword);
                alert('Account registered! Now Sign In.');
                setAuthView('signin');
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                localStorage.removeItem('panel_logged_in');
            };

            // Inline Session ID Add Handler
            const handleAddAccount = (e) => {
                e.preventDefault();
                if (!inputSessionId || !inputSessionId.trim()) return alert('Please enter a valid session ID!');

                setIsVerifying(true);
                fetch('/api/account/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sessionid: inputSessionId.trim() })
                })
                .then(res => res.json())
                .then(data => {
                    setIsVerifying(false);
                    if(data.status === 'success') {
                        const newNode = {
                            id: Date.now().toString(),
                            username: data.username,
                            sessionid: data.sessionid
                        };
                        setNodes(prev => [...prev, newNode]);
                        setSelectedNodeId(newNode.id);
                        setInputSessionId('');
                        alert(`Successfully connected @${data.username}!`);
                    } else {
                        alert(data.message || 'Verification failed!');
                    }
                })
                .catch(() => {
                    setIsVerifying(false);
                    alert('Network error during verification.');
                });
            };

            const toggleSpam = () => {
                if(nodes.length === 0) return alert('Please add at least one Instagram ID first!');
                const activeNode = nodes.find(n => n.id === selectedNodeId);
                if(!activeNode) return alert('Select a valid Instagram ID!');
                if(!spamThread || !spamPayload) return alert('Enter Thread ID and message payload!');

                const endpoint = isSpamming ? '/api/task/stop' : '/api/task/start';
                const payload = {
                    task_id: 'spam_task',
                    type: 'spam',
                    session_id: activeNode.sessionid,
                    username: activeNode.username,
                    thread_id: spamThread,
                    jitter: spamJitter,
                    payload: spamPayload.split('\n').filter(x => x.trim())
                };

                fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                }).then(res => res.json()).then(data => {
                    if(data.status === 'success') {
                        setIsSpamming(!isSpamming);
                    } else {
                        alert(data.message);
                    }
                });
            };

            const toggleNcLock = () => {
                if(nodes.length === 0) return alert('Please add at least one Instagram ID first!');
                const activeNode = nodes.find(n => n.id === selectedNodeId);
                if(!activeNode) return alert('Select a valid Instagram ID!');
                if(!ncThread || !ncText) return alert('Enter Group Thread ID and Title Base!');

                const endpoint = ncActive ? '/api/task/stop' : '/api/task/start';
                const payload = {
                    task_id: 'nc_task',
                    type: 'nclock',
                    session_id: activeNode.sessionid,
                    username: activeNode.username,
                    thread_id: ncThread,
                    jitter: ncJitter,
                    nc_text: ncText
                };

                fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                }).then(res => res.json()).then(data => {
                    if(data.status === 'success') {
                        setNcActive(!ncActive);
                    } else {
                        alert(data.message);
                    }
                });
            };

            return (
                <div className="min-h-screen bg-[#0a0a0a] text-white p-4 flex flex-col">
                    {!isLoggedIn ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="bg-[#141414] border border-red-900/60 p-6 rounded-2xl w-full max-w-md shadow-[0_0_30px_rgba(255,0,60,0.2)]">
                                <div className="text-center mb-6">
                                    <h1 className="text-xl font-black text-red-600 uppercase">AARYAV PANNEL SPAM IG</h1>
                                    <p className="text-xs text-neutral-400">Owner: @Abusivegang</p>
                                </div>
                                {authView === 'signin' ? (
                                    <form onSubmit={handleSignIn} className="flex flex-col gap-4">
                                        <input type="text" placeholder="Username" value={loginUsername} onChange={e=>setLoginUsername(e.target.value)} className="bg-black border border-neutral-800 rounded p-2.5 text-xs text-white outline-none"/>
                                        <input type="password" placeholder="Password" value={loginPassword} onChange={e=>setLoginPassword(e.target.value)} className="bg-black border border-neutral-800 rounded p-2.5 text-xs text-white outline-none"/>
                                        <button type="submit" className="py-3 bg-red-600 font-bold text-xs uppercase rounded">Sign In</button>
                                        <div className="text-center text-xs"><button type="button" onClick={()=>setAuthView('signup')} className="text-red-500 font-bold">Sign Up for Access</button></div>
                                    </form>
                                ) : (
                                    <form onSubmit={handleSignUp} className="flex flex-col gap-4">
                                        <input type="text" placeholder="Choose Username" value={regUsername} onChange={e=>setRegUsername(e.target.value)} className="bg-black border border-neutral-800 rounded p-2.5 text-xs text-white outline-none"/>
                                        <input type="password" placeholder="Choose Password" value={regPassword} onChange={e=>setRegPassword(e.target.value)} className="bg-black border border-neutral-800 rounded p-2.5 text-xs text-white outline-none"/>
                                        <button type="submit" className="py-3 bg-red-600 font-bold text-xs uppercase rounded">Register Account</button>
                                        <div className="text-center text-xs"><button type="button" onClick={()=>setAuthView('signin')} className="text-red-500 font-bold">Back to Sign In</button></div>
                                    </form>
                                )}
                            </div>
                        </div>
                    ) : (
                        <div className="flex flex-col flex-1 gap-4 max-w-6xl mx-auto w-full">
                            <header className="border-b border-red-900/60 pb-4 flex justify-between items-center bg-[#141414] p-4 rounded-xl">
                                <div>
                                    <h1 className="text-xl font-black text-red-600 uppercase">AARYAV PANNEL SPAM IG</h1>
                                    <p className="text-xs text-neutral-400">Status: <span className="text-emerald-500 font-bold">LIVE API BACKEND CONNECTED</span></p>
                                </div>
                                <button onClick={handleLogout} className="bg-neutral-900 text-neutral-400 px-3 py-2 rounded text-xs">Logout</button>
                            </header>

                            {/* Inline Session ID Input & Management Bar */}
                            <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex flex-col gap-3">
                                <h2 className="text-sm font-bold text-red-500 uppercase">Instagram Account Management</h2>
                                <form onSubmit={handleAddAccount} className="flex flex-col sm:flex-row gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="Paste sessionid cookie here..." 
                                        value={inputSessionId} 
                                        onChange={e => setInputSessionId(e.target.value)} 
                                        className="bg-black border border-neutral-800 rounded p-2.5 text-xs flex-1 outline-none text-white"
                                    />
                                    <button type="submit" disabled={isVerifying} className="bg-red-600 text-white px-4 py-2.5 rounded text-xs font-bold hover:bg-red-700 transition">
                                        {isVerifying ? 'Verifying...' : '+ Add & Verify ID'}
                                    </button>
                                </form>

                                <div className="flex items-center gap-3 pt-2 border-t border-neutral-900">
                                    <span className="text-xs font-bold text-neutral-400">Active Sender:</span>
                                    {nodes.length === 0 ? (
                                        <span className="text-xs text-neutral-500 italic">No IDs added yet. Paste session ID above.</span>
                                    ) : (
                                        <select value={selectedNodeId} onChange={e=>setSelectedNodeId(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs text-red-400 font-bold outline-none flex-1">
                                            {nodes.map(n => (
                                                <option key={n.id} value={n.id}>@{n.username} (Saved)</option>
                                            ))}
                                        </select>
                                    )}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                {/* Spam Panel */}
                                <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-red-500 uppercase">Direct Message Spam Campaign</h2>
                                    <input type="text" placeholder="Target GC / Thread ID" value={spamThread} onChange={e=>setSpamThread(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <input type="text" placeholder="Jitter Delay (Sec e.g. 3.5)" value={spamJitter} onChange={e=>setSpamJitter(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <textarea rows="4" placeholder="Payload lines (one message per line)..." value={spamPayload} onChange={e=>setSpamPayload(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none resize-none"></textarea>
                                    <button onClick={toggleSpam} className={`py-3 rounded font-bold text-xs uppercase transition ${isSpamming ? 'bg-red-950 text-red-500 border border-red-600 animate-pulse' : 'bg-red-600 text-white hover:bg-red-700'}`}>
                                        {isSpamming ? 'HALT SPAM WORKER' : 'LAUNCH REAL SPAM WORKER'}
                                    </button>
                                </div>

                                {/* NC Lock Panel */}
                                <div className="bg-[#141414] border border-red-950 p-4 rounded-xl flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-red-500 uppercase">Group Name Protection (NC Lock)</h2>
                                    <input type="text" placeholder="Target GC / Thread ID" value={ncThread} onChange={e=>setNcThread(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <input type="text" placeholder="Protected Title Base (e.g. AARYAV GANG)" value={ncText} onChange={e=>setNcText(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <input type="text" placeholder="Rotation Interval (Sec e.g. 4.0)" value={ncJitter} onChange={e=>setNcJitter(e.target.value)} className="bg-black border border-neutral-800 rounded p-2 text-xs outline-none"/>
                                    <button onClick={toggleNcLock} className={`py-3 rounded font-bold text-xs uppercase transition ${ncActive ? 'bg-red-900 text-white' : 'bg-neutral-800 text-red-400 hover:bg-neutral-700'}`}>
                                        {ncActive ? 'DISABLE NC LOCK' : 'ENABLE REAL NC LOCK'}
                                    </button>
                                </div>
                            </div>

                            {/* Live Logs Terminal */}
                            <div className="bg-black border border-red-950 p-3 rounded-xl font-mono text-[11px] h-48 overflow-y-auto text-red-500 shadow-inner flex flex-col">
                                <div className="text-neutral-600 border-b border-neutral-900 pb-1 mb-1">[LIVE INSTAGRAM API TELEMETRY]</div>
                                {logs.map((lg, i) => <div key={i}>{lg}</div>)}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
